[OpenNR-RR]
; Enable or disable OpenRR (DLSS Ray Reconstruction on AMD RX 9000 / RDNA4 GPUs).
Enabled = true

; Execution backend for D3D12 games:
;   auto   = D3D12 Direct ELF into the game's command list (falls back to Vulkan interop bridge if unavailable)
;   d3d12  = D3D12 Direct ELF
;   vulkan = D3D12 <-> Vulkan shared-resource interop bridge (splits command list around Vulkan compute)
; Native Vulkan games always run directly on the game's Vulkan device (RecordVk).
Backend = auto

; Network execution mode:
;   new    = Fast mode (_lt kernels, recommended)
;   legacy = Full-precision fast kernels
Mode = new

; Vulkan host input layout (shader_read or general)
VkInputLayout = shader_read

; Optional override for depth buffer type: auto, true (hardware depth), or false (linear depth)
HardwareDepth = auto

; Guide switches
UseDisocclusionMask = true
InvertDisocclusionMask = false
ClampDisocclusionMask = true
DisocclusionMaskScale = 1.0
UseSssGuide = true
UseResponsivityMask = false
UseColorBeforeTransparency = false
UseDepthOfFieldGuide = false
UseReflectionMotionVectors = false
UseLayerOpacityAndMotion = false
