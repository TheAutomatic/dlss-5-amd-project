[Plugins]
; -------------------------------------------------------
; Path that will be searched for same filename plugins (dxgi.dll, winmm.dll, etc.)
; Relative paths use the game EXE directory, independent of the launcher working directory.
; Default is plugins under the resolved OptiDllPath (EXE directory if OptiDllPath is invalid).
Path=auto

; Lets OptiScaler load *.asi files in plugins folder
; true or false - Default (auto) is false
LoadAsiPlugins=auto

; Delay before injecting late-loaded *.asi files in plugins folder
; To load an ASI plugin late, add -loadlate to its filename before the extension, e.g. "myplugin-loadlate.asi"
; Integer value in seconds - Default (auto) is 30
LateAsiPluginsDelay=auto

; Loads SpecialK64.dll from game's exe folder
; Please create an empty SpecialK.dxgi file next to SpecialK64.dll
; to set SpecialK's working mode, otherwise it will not be activated
; BECAUSE OF STABILITY ISSUES, WILL NOT BE LOADED WHEN OPTIFG, DLSSG via SL or FSR-FG INPUTS ARE ENABLED
; true or false - Default (auto) is false
LoadSpecialK=auto

; Loads ReShade64.dll or d3d12-ReShade64.dll from the game's exe folder.
; Keep the chosen original DLL name and set this option to true.
; true or false - Default (auto) is false
LoadReshade=auto

; Loads custom amdxc64.dll for all detected RDNA 2 GPUs
; OptiScaler loads it from OptiDllPath, e.g. ".\OptiScaler\amdxc64.dll"
; true or false - Default (auto) is false
LoadCustomAmdxc64OnRdna2=auto

; -------------------------------------------------------
[fakenvapi]
; -------------------------------------------------------
; Use fakenvapi when nvapi64.dll is missing.
; fakenvapi replaces nvapi calls allowing for features like AntiLag 2 or XeLL to replace Reflex
; Sometimes also required for DLSS/DLSSG to show up
; true or false - Default (auto) is true
UseFakenvapi=auto

; Allow XeLL to work without FG on non-Intel cards, Requires updated libxell + libxess_fg
; Disables FG options
; true or false - Default (auto) is false
ForceXeLL=auto

; Tries to use LatencyFlex even when better options are avaliable
; Doesn't take effect when using XeFG
; true or false - Default (auto) is false
ForceLatencyFlex=auto

; Controls how latencyflex works
; 0 = conservative
; 1 = aggressive, will improve latency but in some cases will lower fps more than expected
; 2 = use reflex frame ids, some games are not compatible (i.e. cyberpunk) and will fallback to aggressive
; Default (auto) is 0
LatencyFlexMode=auto

; Force Reflex state, useful for games that only enable Reflex when using DLSSG without a separate toggle for Reflex
; 0 - follow in-game setting, 1 - force disable, 2 - force enable
; Default (auto) is 0
ForceReflex=auto

; Low latency input, the game's low latency that OptiScaler translates
; 2 - AntiLag 2, 3 - Reflex, 4 - XeLL, 5 - UE low latency
; The game's own XeFG (also the XeFG input to XeFG output) keeps the game's XeLL, only the FPS limit is OptiScaler's
; Default (auto) uses the best one the game sends: Reflex, XeLL when enabled in the game, AntiLag 2, UE low latency,
; XeLL when not enabled in the game (XeLL first with the XeFG input while the game has it enabled, AntiLag 2 first
; while the game's FSR-FG reports its frames through it)
LowLatencyInput=auto

; Low latency output, what the input is translated to
; 2 - LatencyFlex, 3 - AntiLag 2, 4 - XeLL, 6 - Reflex (Nvidia), 7 - FPS Limiter (only limits the FPS)
; OptiScaler's XeFG always uses XeLL, the game's own XeFG its own XeLL
; Default (auto) is the best one for your current setup
LowLatencyOutput=auto



