[V-Sync]
; -------------------------------------------------------
; Enable V-Sync controls
; true or false - Default (auto) is false
OverrideVsync=auto

; Force V-Sync value
; true or false - Default (auto) is none selected
ForceVsync=auto

; Sync interval value for V-Sync
; 0 to 3 - Default (auto) is none selected
SyncInterval=auto



; -------------------------------------------------------
[Anisotropy]
; -------------------------------------------------------
; Override max Anisotropy/Anisotropic Filtering for textures
; 2, 4, 8, 16 - Default (auto) is disabled
AnisotropyOverride=auto

; Change comparison filters to Anisotropic ones
; true or false - Default (auto) is true
ModifyComparison=auto

; Change min/max filters to Anisotropic ones
; true or false - Default (auto) is true
ModifyMinMax=auto

; Skip overriding on point filters
; true or false - Default (auto) is true
SkipPointFilter=auto



; -------------------------------------------------------
[Mipmap]
; -------------------------------------------------------
; Override value for Mipmap LOD bias
; -15.0 - 15.0 - Default (auto) is disabled
MipmapBiasOverride=auto

; Use a fixed value for LOD bias 
; true or false - Default (auto) is false
MipmapBiasFixedOverride=auto

; Use override value as scale multiplier 
; true or false - Default (auto) is false
MipmapBiasScaleOverride=auto

; Override all textures LOD bias (normally only overriding < 0 values)
; true or false - Default (auto) is false
MipmapBiasOverrideAll=auto



; -------------------------------------------------------
[ProcessFilter]
; -------------------------------------------------------
; Only inject into this specific process (case-insensitive)
; Example: TargetProcessName=endfield.exe
; Default (auto) is disabled (injects into all processes)
TargetProcessName=auto

; Don't inject into this specific process (case-insensitive)
; Process names seperated with pipe "|" - Default (auto) is 
; crashpad_handler.exe and others - listed in Config.h under ProcessFilter
ProcessExclusionList=auto



; -------------------------------------------------------
[Hotfix]
; -------------------------------------------------------
; Enables checking for latest version from Github
; true or false - Default (auto) is false
CheckForUpdate=auto

; Enables blocking of Steam and Epic overlays
; Also blocks Steam Input
; true or false - Default (auto) is false, except for OptiFG when true
DisableOverlays=auto

; Use manual input polling instead of hooking WndProc
; Might help games which does not capture inputs properly
; As a downside it will not be able to block inputs when menu is open
; true or false - Default (auto) is false
ManualInputPolling=auto

; Simulate waitable object event signals for FG swapchain
; true or false - Default (auto) is false
SimulateWaitableObject=auto

; OptiScaler will delay loading of Reshade and create D3D12 device first
; This option will prevent warnings/crashes with Luma and some other ReShade mods
; When using Luma mod and this will be enabled
; true or false - Default (auto) is false
CreateD3D12DeviceForLuma=auto

; OptiScaler will try to force High Performance GPU
; true or false - Default (auto) is false
PreferDedicatedGpu=auto

; OptiScaler will report only first High Performance GPU
; true or false - Default (auto) is false
PreferFirstDedicatedGpu=auto

; Rounds internal resolutions width and height to multiple of this value
; 2, 4, 8, 16 ...  - Default (auto) is disabled
RoundInternalResolution=auto

; Skips upscaling of n frames
; n is integer number  - Default (auto) is disabled
SkipFirstFrames=auto

; Restore last used compute signature after upscaling
; true or false - Default (auto) is false
RestoreComputeSignature=auto

; Restore last used graphics signature after upscaling
; true or false - Default (auto) is false
RestoreGraphicSignature=auto

; Tries to track signature changes to fully restore them
; Useful for games using bindless
; true or false - Default (auto) is false
ExtendedStateRestore=auto

; Use precompiled shaders for RCAS, Output Scaling and Mask Bias
; true or false - Default (auto) is true
UsePrecompiledShaders=auto

; Color texture resource state to fix for rainbow colors on AMD cards (for mostly UE games) 
; For UE engine games on AMD, set Color to 4 (D3D12_RESOURCE_STATE_RENDER_TARGET)
ColorResourceBarrier=auto
; For UE engine games on AMD, set MotionVector to 8 (D3D12_RESOURCE_STATE_UNORDERED_ACCESS)
MotionVectorResourceBarrier=auto
DepthResourceBarrier=auto
ColorMaskResourceBarrier=auto
ExposureResourceBarrier=auto
OutputResourceBarrier=auto

; Default (auto) is state correction disabled
; These settings defines each resources initial resource 
; state and add resource barrier for correct state
;
; Common resource barrier states
; ----------------------------------------------------
; D3D12_RESOURCE_STATE_COMMON = 0,
; D3D12_RESOURCE_STATE_VERTEX_AND_CONSTANT_BUFFER = 1,
; D3D12_RESOURCE_STATE_INDEX_BUFFER	= 2,
; D3D12_RESOURCE_STATE_RENDER_TARGET = 4,
; D3D12_RESOURCE_STATE_UNORDERED_ACCESS	= 8,
; D3D12_RESOURCE_STATE_DEPTH_WRITE = 16,
; D3D12_RESOURCE_STATE_DEPTH_READ = 32,
; D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE = 64,
; D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE = 128,
;------------------------------------------------------
; 
; All state values can be checked from here
; https://learn.microsoft.com/en-us/windows/win32/api/d3d12/ne-d3d12-d3d12_resource_states

[DlssNr]
; Mochizuki v0.0.4: independent settings; see docs/mochizuki.md.
; Includes the HDR hue fix from upstream v0.0.4 (Linux-only release); Windows INT4 is not enabled.
; Pass 1 model strength. Independent of final Overall Intensity; default 1.
MochizukiIntensity=1.0
; Pass 1 style: 0 Standard, 1 Natural, 2 Cinematic. Default 0.
MochizukiStyle=0
; Pass 1 model tone response, default 1.
MochizukiLocalTone=1.0
; Pass 1 structure response, default 1.
MochizukiLocalStructure=1.0
; Pass 1 skin structure: -1 follows LocalStructure.
MochizukiSkinStructure=-1.0
; Use the model character mask. Default true.
MochizukiAutomaticMask=true
; Final detail blend; default 1. Does not reduce network work.
MochizukiDetailStrength=1.0
; Final colour blend; default 1.
MochizukiColourStrength=1.0
; Highlight ratio guard for output blending; default 2.
MochizukiMaxRatio=2.0
; Reduced model resolution only: 0 matched residual (default), 1 edge-aware, 2 classic.
; Classic uses MochizukiClassicScaler. Edge-aware and classic cost more GPU time. No effect at 100% model scale.
MochizukiEnlargeMode=0
; Classic enlargement: 0 bilinear, 1 Catmull-Rom (default), 2 Lanczos3, 3 FSR1. Used when EnlargeMode is 2.
MochizukiClassicScaler=1
; ACO fast mode (experimental). Default true. Save Settings, then restart the game.
; A missing bundle, record mismatch or unsupported driver keeps the driver's compiler.
MochizukiAcoMode=true
; Network model: 0 = 310.8.0 original, 1 = 310.9.16 new (default).
; The new model needs dlssnr-small.bin; without it the original model runs.
; INT4 mixed requires model 0. Model and INT4 preferences are saved independently.
MochizukiNetworkModel=1
; ---- Mochizuki INT4 mixed / RenoDX processing (Windows 0.0.5+; Ctrl+F11 toggles requests) ----
; Both need effective ACO; otherwise the default network runs. Mode changes rebuild the network
; in the background. Person protection is disabled in RenoDX mode. See docs/mochizuki.md.
; INT4 mixed weights; requires MochizukiNetworkModel=0. Default false.
MochizukiInt4Mixed=false
; Enable the RenoDX processing route (separate response/pass/composition/look/encoding controls below).
; Default false.
MochizukiRenoDX=false
; Advance the noise seed every frame instead of reusing it; more GPU time. Default false.
MochizukiNoiseEveryFrame=false

; ---- RenoDX pass 1 ----
; Extra neural-uplift stage; default true (on).
MochizukiRenoNeuralUplift=true
; Model intensity, 0..2; default 1.
MochizukiRenoIntensity=1.0
; Style: 0 Standard, 1 Natural, 2 Cinematic; default 0.
MochizukiRenoStyle=0
; Tone / structure responses, 0..2; default 1. Skin structure: -1..1, -1 follows LocalStructure.
MochizukiRenoLocalTone=1.0
MochizukiRenoLocalStructure=1.0
MochizukiRenoSkinStructure=-1.0
; Use the model character mask in the RenoDX route; default false.
MochizukiRenoAutoMask=false
; Keep skin structure independent of the structure clamp while AutoMask is on; default true.
MochizukiRenoSkinIndependent=true

; ---- RenoDX pass stack (1-4 normally; passes 5+ use pass 4 controls) ----
; Active RenoDX passes, 1..30; default 1. Higher costs proportionally more GPU time.
MochizukiRenoPasses=1
; Let the menu raise the pass slider above 4; default false. Does not change the count by itself.
MochizukiRenoUnlockPasses=false
; Chain each pass's history into the next instead of resetting between passes; default true.
MochizukiRenoChainedHistory=true
; Per-pass controls. FollowPass1=true (default) inherits pass 1; otherwise:
; Transfer/Color 0..1 (blend of this pass's edit), Intensity 0..2, Style 0..2,
; LocalTone/LocalStructure 0..2, Skin -1..1 (-1 follows structure), AutoMask as pass 1.
MochizukiRenoPass2FollowPass1=true
MochizukiRenoPass2Transfer=1.0
MochizukiRenoPass2Color=1.0
MochizukiRenoPass2Intensity=1.0
MochizukiRenoPass2Style=0
MochizukiRenoPass2LocalTone=1.0
MochizukiRenoPass2Structure=1.0
MochizukiRenoPass2Skin=-1.0
MochizukiRenoPass2AutoMask=false
MochizukiRenoPass3FollowPass1=true
MochizukiRenoPass3Transfer=1.0
MochizukiRenoPass3Color=1.0
MochizukiRenoPass3Intensity=1.0
MochizukiRenoPass3Style=0
MochizukiRenoPass3LocalTone=1.0
MochizukiRenoPass3Structure=1.0
MochizukiRenoPass3Skin=-1.0
MochizukiRenoPass3AutoMask=false
MochizukiRenoPass4FollowPass1=true
MochizukiRenoPass4Transfer=1.0
MochizukiRenoPass4Color=1.0
MochizukiRenoPass4Intensity=1.0
MochizukiRenoPass4Style=0
MochizukiRenoPass4LocalTone=1.0
MochizukiRenoPass4Structure=1.0
MochizukiRenoPass4Skin=-1.0
MochizukiRenoPass4AutoMask=false

; ---- RenoDX composition ----
; Final colour / detail blend of the RenoDX edit; default 1.
MochizukiRenoColorStrength=1.0
MochizukiRenoTransferStrength=1.0
; Chroma gain clamp in stops, 0.25..2; default 1.
MochizukiRenoChromaClamp=1.0
; Transfer mode of the model edit; default 0.
MochizukiRenoTransferMode=0
; Style highlight guard; 0 = off (default).
MochizukiRenoStyleHighlightGuard=0.0
; Temporal smoothing of the detail response; 0 = off (default).
MochizukiRenoDetailStability=0

; ---- RenoDX resolution ----
; Model working scale, default 1 (smaller costs less, changes detail).
MochizukiRenoResolutionScale=1.0
; Tie the working scale to the input resolution instead; default false.
MochizukiRenoFollowInputRes=false
; Look-stage upsample filter; default 0.
MochizukiRenoLookUpsample=0

; ---- RenoDX look (grade) ----
; LookMode: enable the grade stage; default false. LookStrength: overall grade blend, default 1.
MochizukiRenoLookMode=false
MochizukiRenoLookStrength=1.0
; Brighten/Darken multipliers, default 1. Max* are absolute caps, default 0 = uncapped.
MochizukiRenoLookBrighten=1.0
MochizukiRenoLookDarken=1.0
MochizukiRenoLookMaxBrighten=0.0
MochizukiRenoLookMaxDarken=0.0
; Colour / hue multipliers, default 1. MaxColour cap, default 0 = uncapped.
MochizukiRenoLookColour=1.0
MochizukiRenoLookHue=1.0
MochizukiRenoLookMaxColour=0.0
; Zone gains (shadows / midtones / highlights), default 1.
MochizukiRenoLookShadows=1.0
MochizukiRenoLookMidtones=1.0
MochizukiRenoLookHighlights=1.0
; Tone and detail multipliers of the grade, default 1. DetailRadius: detail sampling radius, default 1.
MochizukiRenoLookTone=1.0
MochizukiRenoLookDetail=1.0
MochizukiRenoLookDetailRadius=1.0
; Halo suppression and its bright-side bias; 0 = off (default).
MochizukiRenoLookHalo=0.0
MochizukiRenoLookHaloBrightSide=0.0
; Temporal stabilization of the grade: 0 = off (default); window in ms (default 60);
; StabilizeDetail keeps detail outside the smoothing.
MochizukiRenoLookStabilize=0
MochizukiRenoLookStabilizeMs=60.0
MochizukiRenoLookStabilizeDetail=false
; SDR black restore and display pedestal offsets; 0 = off (default for both).
MochizukiRenoSdrBlackRestore=0
MochizukiRenoDisplayPedestal=0

; ---- RenoDX encoding / normalisation (advanced; defaults follow the upstream runtime) ----
; CodecMode: input codec mode; default 2. SourceEncoding: source colour encoding; default 0.
; NeuralFloorGuard: keep the neural floor bounded; default true.
MochizukiRenoCodecMode=2
MochizukiRenoSourceEncoding=0
MochizukiRenoNeuralFloorGuard=true
; Linear-unit white levels (nits) and paper-white scale; defaults 0 / 2.5375 / 203 / 1.0.
MochizukiRenoLinearUnitNits=0.0
; Luminance proxy anchor for the normalisation path; advanced, default 4.0.
MochizukiRenoProxyAnchor=4.0
MochizukiRenoPaperWhiteScale=2.5375
MochizukiRenoDiffuseWhiteNits=203.0
MochizukiRenoPQCalibration=1.0
; NR feed mode (exposure source for the feed); default 0.
MochizukiRenoFeedMode=0
; Exposure normalisation governor: mode default 2; CutAware default true; attack/release/slew
; rates in stops (defaults 4.0 / 0.5 / 0.02).
MochizukiRenoNormGovernor=2
MochizukiRenoNormCutAware=true
MochizukiRenoNormAttackStops=4.0
MochizukiRenoNormReleaseStops=0.5
MochizukiRenoNormSlewStops=0.02
; Motion-vector scale multipliers fed to the RenoDX route; default 1.
MochizukiRenoMVecScaleX=1.0
MochizukiRenoMVecScaleY=1.0

; Reuse the private full-resolution copy for the final output. Saves one RGBA32F image.
; Defaults on; 8-bit/native-compose paths keep their existing buffers. Toggle rebuilds the network.
MochizukiCompactTransfer=true
; Manual white point for linear input; default 1. Separate from preprocessing exposure.
MochizukiWhitePoint=1.0
; Input resolution scale, 0.25..1. Default 1. Higher costs more GPU time/VRAM and can rebuild.
MochizukiModelScale=1.0
; Allow pass counts above 3, up to 30. Default false. Off keeps MochizukiPasses at 1..3.
; On does not force 30. Pick the count with MochizukiPasses. Higher counts rebuild and cost more GPU time.
MochizukiUnlockPasses=false
; Ignored. Older builds used 1 to force exactly 30 layers. The count is MochizukiPasses.
MochizukiLayerMode=0
; Active passes. 1..3, or 1..30 while MochizukiUnlockPasses is true. Default 1.
; Applies when editing finishes. A higher count can rebuild the network.
MochizukiPasses=1
; Enable temporal history with supported unjittered motion vectors; unavailable vectors disable history.
MochizukiTemporal=true
; Hold NR off for the rest of the session when too many command lists arrive without a
; recording proxy. Unwrapped lists fall back to the original colour, so a high miss rate
; makes NR and the original alternate frame by frame (visible flicker). Default false.
MochizukiProxyFallbackEnabled=false
; Linear-input level (only affects linear/HDR colour; MochizukiWhitePoint stays the trim).
; WhitePointSource: where the linear white point comes from. Default 0. No rebuild; next frame.
;   0 = off: manual MochizukiWhitePoint only (unchanged look).
;   1 = game: the game's exposure (DLSS exposure texture x DLSS_Exposure_Scale / DLSS_Pre_Exposure,
;       or 1/DLSS_Pre_Exposure without a texture); manual when the game gives none.
;   2 = meter: always meter the frame (highlight-clipped mean, 1 frame late), ignoring the game; manual until metered.
;   3 = auto: game exposure if usable, else meter, else manual.
; Try 2 or 3 when skin looks red/oversaturated at NrOverallIntensity > 1 (e.g. Monster Hunter Wilds).
MochizukiWhitePointSource=0
; Temporal history strength; default 1. Requires Temporal and valid motion vectors.
MochizukiHistoryStrength=1.0
; Transform model input and reverse the transform on output. Default false; changes may rebuild.
MochizukiPreprocess=false
; Preprocessing exposure: 0 Off, 1 Auto, 2 Fixed. Default 1; only used with Preprocess.
MochizukiPreprocessExposure=1
; Preprocessing exposure bias in EV; default 0.
MochizukiPreprocessBiasEv=0.0
; Curve: 0 None, 1 Neutral, 2 Reinhard, 3 Filmic, 4 GT, 5 ACES, 6 AgX. Default 3.
MochizukiPreprocessCurve=3
; Preprocessing contrast; default 1.
MochizukiPreprocessContrast=1.0
; Preprocessing saturation; default 1.
MochizukiPreprocessSaturation=1.0
; Apply the model result. false still runs the network; disable NR to save computation.
MochizukiApplyModel=true
; Input encoding: 0 Auto, 1 Linear, 2 Encoded. Default 0; changes can rebuild.
MochizukiLinearInput=0
; Prebuild capacity: 0 auto, or 1..3 (1..30 while MochizukiUnlockPasses is true).
; Auto retains capacity when passes decrease. An explicit count is at least the active passes.
MochizukiMaxPasses=0
; DRS: 0 Exact, 1 Auto bucket, 2 Always bucket. Buckets reduce repeated builds; default 1.
MochizukiDynamicResolution=1
; Pass 2: Enable independent pass settings. false inherits pass 1 except LocalTone=0. Used when this pass is active and Override=true.
MochizukiPass2Override=false
; Pass 2: Style: 0 Standard, 1 Natural, 2 Cinematic. Used when this pass is active and Override=true.
MochizukiPass2Style=0
; Pass 2: Model intensity for this pass, default 1. Used when this pass is active and Override=true.
MochizukiPass2Intensity=1.0
; Pass 2: Model tone for this pass, default 0. Used when this pass is active and Override=true.
MochizukiPass2LocalTone=0.0
; Pass 2: Structure response for this pass, default 1. Used when this pass is active and Override=true.
MochizukiPass2LocalStructure=1.0
; Pass 2: Skin structure: -1 follows this pass LocalStructure. Used when this pass is active and Override=true.
MochizukiPass2SkinStructure=-1.0
; Pass 2: Use model character mask for this pass; default true. Used when this pass is active and Override=true.
MochizukiPass2AutomaticMask=true
; Pass 3: Enable independent pass settings. false inherits pass 1 except LocalTone=0. Used when this pass is active and Override=true.
MochizukiPass3Override=false
; Pass 3: Style: 0 Standard, 1 Natural, 2 Cinematic. Used when this pass is active and Override=true.
MochizukiPass3Style=0
; Pass 3: Model intensity for this pass, default 1. Used when this pass is active and Override=true.
MochizukiPass3Intensity=1.0
; Pass 3: Model tone for this pass, default 0. Used when this pass is active and Override=true.
MochizukiPass3LocalTone=0.0
; Pass 3: Structure response for this pass, default 1. Used when this pass is active and Override=true.
MochizukiPass3LocalStructure=1.0
; Pass 3: Skin structure: -1 follows this pass LocalStructure. Used when this pass is active and Override=true.
MochizukiPass3SkinStructure=-1.0
; Pass 3: Use model character mask for this pass; default true. Used when this pass is active and Override=true.
MochizukiPass3AutomaticMask=true

; Optional asynchronous NR/codec/effects measurement; default off.
; NrTimingEnabled: measure NR performance. Page Up opens the FPS overlay; Page Down changes detail.
; NrTimingLog: also write the timing summary to the log (needs NrTimingEnabled + file logging;
;   at most one summary per five seconds; also gates runtime execution/harvest diagnostics).
NrTimingEnabled=false
NrTimingLog=false
; One-switch diagnostics for "NR has no effect / flickers" reports; save and restart after changing.
; Does not alter inline, barrier, wrapping or picture settings.
; NrFlickerDiag: coverage details + file logging for a 30-60 s reproduction.
; NrFrameDiag: per-frame trace (record/execute timeline, spin_/watch_ fields).
; NrGameWaitDiag (needs NrFrameDiag): game-thread wait timing, Present -> first submit, gw_* fields.
NrFlickerDiag=false
NrFrameDiag=false
NrGameWaitDiag=false
; Shared final-output blend for all three AMD backends. 0..2, default 1.
; 0 shows the original but still runs NR; disable NR to save model computation.
NrOverallIntensity=1.0
; Experimental person protection: scene uses final NR; people use pass 1 in multi-pass.
; lmxxf/Mochizuki single/multi-pass. Single pass needs a control below 1; Daniel is not supported.
; Requires matching person-model/person-worker.exe, ONNX Runtime CPU x64 API 23+
; and the selected ONNX model. The worker uses private CRT DLLs; game-root CRT is untouched.
; Missing/stale masks or unreliable motion/depth preserve final NR. Default off.
NrPersonPartition=false
; Person model: 0 = PP-HumanSeg (body, default), 1 = YOLO11n-seg (body), 2 = YuNet (face only).
; Only one model runs. YuNet uses yunet.onnx and soft face ovals; small/turned/occluded faces may be missed.
NrPersonModel=0
; YuNet full-frame input: 320 (default), 384, 416 or 448. Larger inputs cost more CPU but can detect smaller faces.
; Other models ignore this setting. Invalid sizes use 320.
NrFaceInputSize=320
; Person strength/detail, 0..1, default 1. Strength 0 retains the NR input inside the mask,
; before shared output effects. Detail reduces only fine NR changes inside the mask.
NrPersonStrength=1.0
NrPersonDetailGain=1.0
; Overlay the person mask for preview. Default false.
NrPersonDebugMask=false

; Experimental shared spatial residual shaping, after backend history, before overall intensity.
; Low/detail gains: 0..2, default 1/1. Does not add network passes or blur original detail.
; Skin/edge detail protection: 0..1, default 0/0 (off). Only constrains introduced fine detail.
; Skin is a colour heuristic, NOT person detection; warm scenery may also be affected.
; These are not temporal anti-flicker. Test HDR/fast motion before enabling by default.
; Neutral 1/1/0/0 keeps the old output path. Pure-backend sessions may need a restart.
NrResidualLowGain=1.0
NrResidualDetailGain=1.0
NrResidualSkinProtection=0.0
NrResidualEdgeProtection=0.0
; Shared temporal residual filtering; requires motion/depth. Off by default.
; May soften moving detail or trail; adds GPU work and history memory.
; Alpha 0..0.95; threshold 0..16 (compressed-colour units of 1/255). Either zero bypasses it.
NrStabilizerEnabled=false
NrStabilizerAlpha=0.8
NrStabilizerThreshold=4.0

; lmxxf network style: 0 / 1 / 2. Default 1; other upstream numeric changes can still change the image.
; Separate from Daniel Style and shared NrOverallIntensity. Live change rebuilds the network.
DLSS5_STYLE=1
; Native model temporal history (anti-flicker). 1-3 passes before SR, with valid motion/depth guides; default on.
; Only the final real pass uses history/exports its temporal weight; predicted pass 3 uses pass 2 weight.
; Can reduce flicker, but adds GPU/VRAM cost and may soften moving detail or cause ghosting.
; Temporarily disables adaptive ViT reuse to avoid flicker. Saved reuse settings are retained and resume when history is off.
LmxxfModelHistory=true
; lmxxf temporal mode: 0 = Off, 1 = Full model history (default, 1-3 passes before SR with motion/depth),
; 2 = Low-frequency stabilization (single-pass before SR with motion), 3 = Residual enhance (single-pass before SR with motion).
DLSS5_TEMPORAL_MODE=1
; Mode 3 residual temporal enhancement gain: 0.0..2.0, default 1.0.
DLSS5_TEMPORAL_ENHANCE_STRENGTH=1.0
; 1080-tier processing rows: 1152 (default), or 1088 (Compact 1080 network).
; 1088 changes the image, especially near the bottom edge. Live change rebuilds the network.
DLSS5_NETWORK_1080_ROWS=1152
; Additional supported colour formats use private FP16 output. Default true.
; Save Settings and restart the game after changing this.
DLSS5_FORMAT_FALLBACK=true
; Native NR input resolution at the selected processing position (before or after SR). true by default; overrides tier/Compact 1080 within the supported budget.
; Larger input costs more GPU time and VRAM (4K can be several times 1080p). Outside the budget, use the tier below.
; Changing native resolution, fast numeric, passes or block skipping rebuilds the network on the next frame.
DLSS5_NETWORK_FREE_RES=true
; Fast approximate C32/C64/C128, ViT and C512 arithmetic (0.41). Default true; false uses normal numeric modules.
DLSS5_FAST_NUMERIC=true
; lmxxf network model: 0 = Original (71 blocks, default), 1 = Small (31 blocks, one pass).
; Small requires locally converted native-game-tiled-assets/small assets.
LmxxfNetworkModel=0
; Requested network passes per frame: 1..3, default 1. More style and extra frame buffers.
; Adaptive ViT reuse is disabled with 2/3 passes. GPU network timing includes all passes.
; See third-pass prediction below.
DLSS5_MULTI_PASS=1
; Only at 3 passes: true runs two real network passes then predicts the third locally (lossy, default true).
; false runs three real passes. No effect at 1/2 passes. Changing this rebuilds the network.
DLSS5_MULTI_PASS_PREDICT=true
; At 2/3 passes, keep first-pass skin tones using a color heuristic (not segmentation). Default false.
DLSS5_MULTI_PASS_SKIN_PROTECT=false
; Ins > Advanced Kernels: both skip lists are adjacent, with no extra subgroup.
; Base skip list for all real network passes. Since upstream 0.40, none runs all 71 blocks.
; Optional 42,43,46 skips the three blocks used by the pre-0.40 default; this changes quality and style.
; CSV 1..38,40..69; blocks 4/69 and byte-stream blocks 5..22,48..65 are unsupported.
; Changing this rebuilds the network on the next frame.
DLSS5_SKIP_BLOCKS=none
; Added to the base list only in real network passes 2/3. Default none; ignored at 1 pass.
; A predicted third pass has no extra network blocks. Gains are small and style changes (lossy).
; CSV 1..38,40..69; blocks 4/69 and byte-stream blocks 5..22,48..65 are unsupported; invalid combinations use none.
DLSS5_MULTI_PASS_SKIP_BLOCKS=none
; Automatic network tier, or fixed 720 / 900 / 1080. Used with native resolution off, or outside its supported budget.
DLSS5_NETWORK_HEIGHT=auto
; Shared allocation / byte-stream paths; defaults match the product runtime.
; SHARED_POOL: one shared HIP allocation pool across passes.
; MH_BYTE_STREAM / DECODER_BYTE / VIT_BYTE_STREAM: byte-stream dispatch variants for the
;   multi-head, decoder and ViT stages.
DLSS5_HIP_SHARED_POOL=true
DLSS5_HIP_MH_BYTE_STREAM=true
DLSS5_HIP_DECODER_BYTE=true

; lmxxf kernel options. Ins / ini own these values; external flags only fill unset host keys.
; FIT_LARGE: fit colour inputs above 1920x1080 onto the 1080 network (same name as env/txt).
; HIP_PDL: HIP programmatic dependent launch between stages.
; WAVE_OWNED / SWIN_RUN / C512_M32 / VIT_PROJ_N64: upstream kernel variants (wave-owned
;   scheduling, fused Swin run, Swin C512 M32 tiling, ViT projection N64).
DLSS5_FIT_LARGE=true
DLSS5_HIP_PDL=true
DLSS5_HIP_WAVE_OWNED=true
DLSS5_HIP_C512_M32=true
DLSS5_HIP_VIT_PROJ_N64=true
DLSS5_HIP_SWIN_RUN=true
; ViT dispatch stream: 0..3; an explicit nonzero stream excludes the ViT byte stream.
DLSS5_HIP_VIT_STREAM=3
DLSS5_HIP_VIT_BYTE_STREAM=false
; Lossy static-frame reuse. Product defaults are looser than upstream; may retain stale detail.
; ViT byte stream disables adaptive reuse. Configure reuse through the Ins menu.
; Inactive while LmxxfModelHistory is enabled (including priming/unsupported guides); this saved setting is not cleared.
DLSS5_VIT_ADAPTIVE=true
DLSS5_VIT_REUSE_PERIOD=16
DLSS5_VIT_REUSE_GLOBAL=1
DLSS5_VIT_REUSE_LOCAL=50
DLSS5_VIT_REUSE_IMAGE=1
; lmxxf exposure: meter only when the game's exposure texture is unavailable (default true).
; AutoExposureScale multiplies the metered/exposure level fed to the codec; default 8.
LmxxfAutoExposure=true
LmxxfAutoExposureScale=8
; Compatibility overrides: change only for troubleshooting; follow each option's apply/restart note.
; Allow NR on command lists that use enhanced barriers (may corrupt state / TDR in untested games).
; auto: on for the game policy (exe name contains "forza"; CrimsonDesert.exe), off otherwise.
; true/false force it. Also in the menu ("Allow enhanced barriers"), applied immediately.
LmxxfAllowEnhancedBarriers=auto
; Experimental same-command-list NR for lmxxf/Mochizuki. Default false.
; The game's command list is never cut: capture, wait and selection are recorded inline, and a
; bounded GPU wait selects this frame's original input on timeout. No query splicing is involved
; (that is NrSplitQuerySplice below, for the split path).
NrInline=auto
; Inline reservation slots for lmxxf, 1..5. Default 3. New recordings admit while below the limit;
; shrinking keeps existing jobs. Live; no restart or model rebuild. Menu shows it only with inline on.
LmxxfInlineSlots=auto
; Split admission for lists that keep a non-timestamp query open across Evaluate (rejected as
; open_query otherwise, e.g. pipeline-statistics scopes around the FFX evaluate). The open pair
; is ended on the producer half and reopened on the continuation, so the game's query result
; covers only the post-split half; engine profiler statistics change.
; auto: on for the game policy (CrimsonDesert.exe), off otherwise; true/false force it.
; Also in the menu ("Split query splice"), applied immediately.
NrSplitQuerySplice=auto
; Inline capture polling backoff. 0 = exponential 50 us doubling to 5000 us (default/auto),
; 1 = fixed 100 us, 2 = event (side-queue capture watch + fence event wake). Applies to the next inline frame without restart; logged as capture_backoff in NrFrameDiag.
NrCaptureBackoff=auto
; Reuse retired inline recordings with identical inputs instead of creating D3D12 objects per frame.
; Shortens the recording lock that delays NR start. Default false; applies to the next frame; logged as inline_reuse.
NrInlineReuse=false
; GPU-armed inline handoff (Mochizuki). The side queue waits for this frame's game list to start, watches the
; capture flag on the GPU with a bounded budget, then starts Vulkan without a CPU verification round trip.
; Missed capture selects the original frame and requests history reset at reclamation; NR still launches.
; Known deferred risk: a claimed but unfinished input copy may race NR on cap/abort (see docs/architecture/nr-capture-proof-deferral.md).
; Default true; applies to the next frame; logged as handoff.
; When true, NrCaptureBackoff is bypassed; NrInlineReuse still applies. When false, the spin options below are inactive.
NrGpuHandoff=true
; Inline spin options (Mochizuki, GPU-armed handoff only; NrSpinPollDelay defaults to 16, others off; apply to the next frame; logged in NrFrameDiag as spin_*/watch_*).
; NrInlineAutoSpin: automatically tune NrSpinPollDelay and NrSpinSlices (whichever are set to auto) in the background when NrInline and NrGpuHandoff are active. Default true/auto; suspended while NrAdaptiveWaitBudget is enabled.
; NrSpinSlices: game-queue wait split into 256 or 1024 shorter dispatches (same timeout); 0 = fixed 64 dispatches, auto = automatic.
; NrSpinPollDelay: ALU between GPU flag polls in game wait + side watch: 16, 64, 0 = off, or auto = automatic (baseline 16).
; NrWatchSlices: GPU-armed side watch split into 256 or 1024 shorter dispatches; 0/auto = 64.
; NrWatchStartDelay: 1-8 ALU-only dispatches before the GPU-armed side watch starts polling (adds handoff latency).
NrInlineAutoSpin=auto
NrSpinSlices=auto
NrSpinPollDelay=auto
NrWatchSlices=auto
NrWatchStartDelay=auto
; NrInlineComputeConvert: Mochizuki inline only. true lets R11G11B10_FLOAT, RGBA8/BGRA8 (UNORM and sRGB) and RGB10A2
; colour frames convert input and write-back on the compute queue instead of graphics blits, so the whole chain runs
; on compute. Model scale below 1 also needs NrInlineComputeDownscale. Default true/auto. Changing it rebuilds the network for those formats.
; Log: "whole chain on compute family".
NrInlineComputeConvert=auto
; NrInlineComputeMotion: Mochizuki inline only. true rescales motion vectors of another extent (dynamic resolution) with a
; compute pass (bilinear, as the blit) instead of a graphics blit, so inline frames can keep the whole chain on
; compute. With 2+ layers it also makes every layer sample the motion vectors in place (no motion blit).
; Default true/auto. Changing it remakes the frame buffers, and the network with 2+ layers (history resets once).
NrInlineComputeMotion=auto
; NrInlineComputeDownscale: Mochizuki inline only. true runs model scale below 1 without blits: the frame is kept in its own
; format and filtered down by a compute pass with the blit's own taps, and the full-size answer is packed on compute
; when it is not stored in the frame's format. Default true/auto. Rebuilds the network when the model scale is below 1.
NrInlineComputeDownscale=auto
; NrInlineComputeExport: Mochizuki inline only. true exports the first layer of multi-layer NR by a compute pack into the
; frame format (RGBA16F, R11G11B10, RGBA8/BGRA8 UNORM, RGB10A2) instead of a blit, so inline frames can keep the
; whole chain on compute. Default true/auto. Rebuilds the network when the first layer is exported.
NrInlineComputeExport=auto
; Inline GPU-armed: adaptive post-claim wait budget (measured, shrinks on cap/abort). Default false
NrAdaptiveWaitBudget=auto
; Early command-list wrap is shared by lmxxf and Mochizuki. auto uses the game rules below.
; Auto: EXE calls in Unreal/Forza, ACMirage.exe and 007FirstLight.exe;
; UnityPlayer.dll calls in Aniimo.exe only. Other EXE names are not aliases for these game rules.
; true also admits EXE and loaded UnityPlayer.dll calls in other games.
; false disables both early paths; normal post-swapchain wrapping stays enabled.
; Ins > Compatibility & Scheduling > Early command-list wrap. Save and restart.
; Forcing early wrap in untested games can cause startup problems.
LmxxfEarlyExeWrap=auto
; Early wrap of command lists created by ANY module (Streamline sl.interposer.dll, dxgi proxies,
; overlays), not just the game EXE. Only effective before the swapchain is created.
; auto: on for the game policy (exe name contains "forza"; "dyinglight"; yysls.exe), off otherwise.
; Independent of LmxxfEarlyExeWrap (true there stays EXE-only).
; May crash other games; try true only if the log shows many 'missing recording proxy'. Save and restart.
LmxxfEarlyAnyModuleWrap=auto
; Diagnostic only: off / split-original / codec-passthrough / hip-passthrough.
; hip-passthrough keeps RGB conversion and HIP shared-buffer copies, skips per-frame NR.
; Model initialization/warm-up still runs; all neural passes are bypassed afterwards.
; INI only. Fully restart after changing; restore off after testing.
LmxxfDiagnostic=off
; Optional XeFG override while NR is actually running. 0/auto = no override.
; Generated-frame count: 1 = 2X, 2 = 3X, 3 = 4X, etc. Requires live multiplier support.
; Never rewrites [XeFG] InterpolationCount. Capability limits affect only the applied value.
XeFGInterpolationCount=auto

; Optional colour-based final-edit filter (not NVIDIA's semantic AutoMask).
; Warm scenery may match; coloured lighting may hide skin. Preview before relying on it.
; Controls apply once to the combined output of all model passes. 0..1 attenuates the edit.
; SkinProtection: master switch of this filter. Default false.
SkinProtection=false
; SkinToneEnabled: let the filter touch skin tones at all. Default true.
SkinToneEnabled=true
; Skin/Skin detail blend, skin colour blend: default 1.
SkinDetail=1.0
SkinColour=1.0
; Environment (non-skin) detail/colour blend: default 1.
EnvironmentDetail=1.0
EnvironmentColour=1.0
; Show the detected skin mask as an overlay (preview only). Default false.
ShowSkinMask=false
; NR toggle: auto = 0x23 (End); -1 = unbound.
ToggleKey=auto

; ---- Shared AMD look / Daniel scheduling (menu: NR pages) ----
; Use the game's own exposure for the shared look instead of metering. Default true.
AmdUseGameExposure=true
; Display-curve stage the model sees: 0 off (default), 1 on. Reinhard-family; ACES-like on highlights.
ToneCurve=0
; Black lift of that display curve, 0..0.25. Default 0 (none).
ToneLift=0.0
; Apply the tone curve to all colour channels; auto follows AmdNeuralLightingStrength > 0.
AmdToneChannels=auto
; Daniel quality: 0 Reference (NVIDIA-exact, default), 1 Fast (cheaper math; RX 7000 always Reference).
Quality=0
; Daniel compute-queue priority boost: 0 normal (default), 1 boosted.
QueuePriority=0
; Daniel execution: 1 same-frame (default), 0 async. Saved as Async by the menu.
AmdInline=1
; DLSS 5 Neural Rendering. Synthesises detail in the upscaler's output, before frame generation sees it.
;
; Needs nvngx_dlssnr.dll 310.8 placed beside OptiScaler or the game executable, plus
; nvngx.dll_dlssnr.dll from this package. RTX 50 uses the original NVIDIA runtime. RTX 20/30/40 needs
; ShortFuse's cross-generation compatibility runtime from the pinned RenoDX thread; see
; INSTALL-DLSSNR.md for its SHA-256. The snippet refuses callers whose module path does not contain
; "nvngx.dll", which is the only reason that second file exists.
;
; Undocumented and driven directly, so none of it is officially supported.
; true or false - Default (auto) is false
Enabled=auto

; Processing order: true = NR -> SR (default), false = SR -> NR (experimental).
; SR -> NR processes display-resolution colour and may need more GPU time/VRAM.
; Mochizuki keeps render-resolution motion and the runtime scales it. Daniel and lmxxf resample
; depth and motion onto the output grid. Unsupported layouts preserve the SR image and show the reason.
; Save and restart if the required hooks are absent. Each backend keeps its 1..3 passes.
; Switching order clears NR history. Native Ray Reconstruction uses the separate controls below.
; true or false - Default (auto) is true
RunBeforeSR=auto

; D3D12 and its bridges: opt in to NR after the game's native Ray Reconstruction.
; RR performs denoising/upscaling first. This never enables RR in unsupported games.
; Defaults: false, one pass, half of RR output width/height (1080p NR at 4K output).
; RRPasses is clamped to 1..3; RRWorkingScale to 0.25..2.0.
ApplyAfterRR=auto
RRPasses=auto
RRWorkingScale=auto

; Number of sequential model layers between one encode and one final composition. Each extra layer
; consumes the preceding model output and owns a separate persistent feature/history. 1 is normal;
; 2 and 3 are deliberately over-processed and cost almost exactly 2x and 3x the model time. The final
; answer is composed once against the immutable base proxy, so colour and transfer do not compound.
; Values are clamped to 1..3.
; Default (auto) is 1
Passes=auto

; How far the frame moves toward the model's picture. Its answer is not added to the frame: it is a
; complete picture, rescaled so its luminance sits where the original says it should, and this blends
; between the two. 0 gives back exactly what the upscaler produced, 1 is the model's picture, and above
; 1 carries on past it. The lmxxf codec accepts 0 to 3; above 1 extrapolates past the network result.
; Default (auto) is 1.0
TransferStrength=auto

; Whether the model's colour arrives with its light. 0 keeps the game's own hue exactly and lets only
; brightness carry the model's verdict; 1 brings the model's colour as well, in its own hue.
; The lmxxf codec accepts 0 to 3; above 1 extrapolates.
; Default (auto) is 1.0
ColourStrength=auto

; Codec paper white passed to lmxxf encode and decode. Finite and in (0, 64]. Default 1.
; This is not the HDR Paper White anchor below.
; Default (auto) is 1.0
LmxxfPaperWhite=auto

; The linear value the encode maps to display white, which belongs to the game's exposure rather than to
; any fixed number: measured frame means in one game ranged from 0.065 to 185. Left automatic, it is
; measured from the frame. This does move the result, not only what the model is shown: the picture the
; model was given is one of the luminances the composition weighs. Applies only to a linear buffer; a
; frame the game reports as already tone-mapped is passed over untouched.
; true or false - Default (auto) is true
; Multiplies the white point above before the model sees the frame -- the paper-white control.
; Default (auto) is 1.0
WhitePointScale=auto

; The most the pass may brighten any pixel, as a multiple of what it already was. Darkening is not
; capped. Guards against the model turning a bright light into a string of coloured cells.
; Default (auto) is 2.0
MaxRatio=auto

; What fraction of the frame the model works at. The frame itself is never reduced -- only the model's
; own work is done small and enlarged. Cost falls with the square of this. Above 1.0 (DX12 & Vulkan)
; the model supersamples: it runs above native and the answer is averaged back down.
; Default (auto) is 1.0
WorkingScale=auto

; The downscaler that averages the model's answer back to native when WorkingScale is above 1.0
; (supersampling). Independent of OutputScaling/Downscaler, so the two can differ. 0 FSR1, 1 Bicubic,
; 2 CatmullRom, 3 Lanczos2, 4 Lanczos3, 5 Kaiser2, 6 Kaiser3, 7 MAGIC.
; Default (auto) is 4 (Lanczos3)
ScalingDownscaler=auto

; 0 off, 1 the picture the model sees, 2 its raw answer, 3 what it changed amplified twenty times.
; A flat grey difference view means the model is doing nothing.
; Default (auto) is 0
DebugView=auto

; Writes matched before/after frames to a dlssnr-capture folder beside OptiScaler when the pass first
; runs. Bounded to eight frames, and each run overwrites the last.
; true or false - Default (auto) is true
AutoCapture=auto

; Model controls. Preset and Style are baked into each feature, so changing them causes a guarded
; feature rebuild after the current GPU work retires. The values are undocumented, and the preset
; scale is not the same one Super Resolution or Ray Reconstruction uses.
; Default (auto) is 0
Preset=auto
Style=auto

; Passes 2 and 3 inherit the pass 1 Preset/Style above when left on auto. Set an override to use a
; different built-in model profile for that layer: preset 0..3; style 0 standard, 1 natural,
; 2 cinematic. These select profiles inside the same NVIDIA model DLL, not different model files.
Pass2Preset=auto
Pass2Style=auto
Pass3Preset=auto
Pass3Style=auto

; Per-pass model strengths (DX12 multipass, including NR after RR).
; Auto inherits pass 1, except LocalTone: auto keeps the legacy later-pass value 0.
; Intensity/LocalStructure/LocalTone: 0..2; SkinStructure: -1..2 (-1 follows structure).
Pass2Intensity=auto
Pass2LocalStructure=auto
Pass2LocalTone=auto
Pass2SkinStructure=auto
Pass2AutoMask=auto
Pass3Intensity=auto
Pass3LocalStructure=auto
Pass3LocalTone=auto
Pass3SkinStructure=auto
Pass3AutoMask=auto

; Default (auto) is 1.0
Intensity=auto
LocalStructure=auto
LocalTone=auto
; -1 means follow local structure, which is the model's own default, not a strength of zero.
; Default (auto) is -1.0
SkinStructure=auto
; true or false - Default (auto) is true
AutoMask=auto
