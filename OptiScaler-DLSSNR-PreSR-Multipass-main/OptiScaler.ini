; float - Default (auto) is 16.0
FontSize=auto

; Path to a font to be used as HQ Font, requires UseHQFont=true
; Best to use monospace fonts
; Example path: C:\\Windows\\Fonts\\comic.ttf
; Default (auto) is bundled Noto Sans SC Regular for English, digits and Chinese.
; No system font or Chinese language pack is required. Custom fonts keep bundled Chinese fallback.
TTFFontPath=auto

