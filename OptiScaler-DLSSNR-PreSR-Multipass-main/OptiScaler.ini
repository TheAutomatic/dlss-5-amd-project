; Ins window size in logical pixels before Menu Scale. auto chooses a viewport-fitting size.
WindowWidth=auto
WindowHeight=auto
; 0=Free, 1=Top left, 2=Top right, 3=Bottom left, 4=Bottom right.
; Existing 0..4 meanings are unchanged. 5=Dock left, 6=Dock right, 7=Dock top, 8=Dock bottom.
