; In-game ImGui menu scale
; 0.5 to 2.0 - Default (auto) is 1.0, gets lower below 900p
Scale=auto

; Shortcut key for opening menu
; For all keycode values, you can check this address
; Match Description with key Value
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; Integer value - Default (auto) is 0x2D which equals VK_INSERT/Insert key, previous default key was 0x24 -> VK_HOME/Home key
; If you want to use e.g. VK_BACK/Backspace key, that would be 0x08 - set ShortcutKey=0x08
; -1 -> No shortcut key
; Menu, FPS, FPS-cycle, FG and [DlssNr] ToggleKey also accept Ctrl/Shift/Alt/Tab chords.
; Examples: Ctrl+Shift+Home, Alt+F10, Ctrl+0x2D. Numeric bindings remain supported.
; Numeric modifier bits: Ctrl=0x10000, Shift=0x20000, Alt=0x40000, Tab=0x80000.
; The menu saves numeric bindings. Exact modifiers must match; shared chords trigger all matching actions.
; Ctrl+F11 remains reserved for Mochizuki model switching while that backend owns the chord.
ShortcutKey=auto

; Extends Scaling Ratio limits to 0.1 - 6.0
; true or false - Default (auto) is false
ExtendedLimits=auto

; Use High Quality Font for Menu
