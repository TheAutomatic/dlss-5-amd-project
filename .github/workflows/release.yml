# Build OptScaler(NR) and attach the user zip to a GitHub Release.
#
# Source default is 3 NR slots (AmdSlots); AMD_SINGLESLOT only moves it to 1.
# Ordinary Release is the shipping configuration — do not add diagnostics.
#
# Does NOT package NVIDIA DLLs, NR weights, or the author's pass DLL.
#
# Dependencies (FFX / XeSS signed bins) come from the git submodules under
# external/. `submodules: recursive` below is what puts them in the workspace —
# they are *.dll, so they are deliberately not committed directly.
#
# Link inputs (freetype.lib, FSR2/FSR31 static libs, vulkan-1.lib, detours.lib)
# live under OptiScaler/library and external/freetype. They are tracked in git
# the same way upstream OptiScaler does (git add -f despite *.lib ignore).
#
# Runner: windows-latest. The benchmarked binaries were built with the v145
# toolset (VS 2026), so we pin PLATFORM_TOOLSET to match rather than letting the
# project's v143 fallback pick a different compiler than the one we benchmarked.
# The preflight step fails loudly if the image no longer ships v145.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version; leave empty to read VERSION'
        required: false
        default: ''

permissions:
  contents: write

env:
  PLATFORM_TOOLSET: v145
  # The MSVC toolchain the measured binaries were built with. The preflight picks
  # the exact installed 14.44.35207 and the build pins VCToolsVersion to it, so CI
  # produces the same compiler as the local build instead of whatever the image
  # happens to default to.
  MSVC_PREFIX: '14.44'
  MSVC_VERSION: '14.44.35207'
  WINDOWS_SDK_VERSION: '10.0.26100.0'
  BUILD_OUT: exports/release-ci

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($env:REQUESTED_VERSION) {
            $v = $env:REQUESTED_VERSION
          }
          if ($v -notmatch '^[0-9A-Za-z._-]+$') { throw "Refusing odd version string: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "resolved version: $v"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Toolchain preflight
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio: $vs"

          # Do NOT probe ...\MSBuild\Microsoft\VC\v*\...\PlatformToolsets by name.
          # That tree exists once per VS generation, each holds a different subset,
          # and picking one shows a misleading list: on the VS2026 image the first
          # match lists only v142 (pulled in for UWP), which reads as "v145 absent"
          # when it is in fact installed. MSVC's own directory is unambiguous.
          $msvcRoot = Join-Path $vs 'VC\Tools\MSVC'
          if (!(Test-Path $msvcRoot)) { throw "No MSVC toolchain directory at $msvcRoot" }
          $have = @(Get-ChildItem -LiteralPath $msvcRoot -Directory |
            Select-Object -ExpandProperty Name | Sort-Object)
          Write-Host "MSVC toolchains: $($have -join ', ')"
          # 14.44 is the toolchain the benchmarked binaries were built with.
          $pick = $have | Where-Object { $_ -eq $env:MSVC_VERSION } | Select-Object -First 1
          if (-not $pick) {
            throw "No MSVC $env:MSVC_VERSION toolchain on this image (have: $($have -join ', '))."
          }
          Write-Host "Using MSVC $pick (PlatformToolset=$env:PLATFORM_TOOLSET)"
          "msvc=$pick" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $deps = @(
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/xess/bin/libxess.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK-v2/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_dx12.dll'
          )
          foreach ($d in $deps) {
            if (!(Test-Path $d)) { throw "Submodule content missing: $d (did checkout fetch submodules?)" }
          }
          Write-Host 'Submodule dependencies present.'

      - name: Link-library preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same as upstream OptiScaler: these *.lib are tracked despite
          # .gitignore (git add -f). They are not in the FFX/XeSS submodules.
          $libRoot = 'OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/library'
          $required = @(
            "$libRoot/fsr2/ffx_fsr2_api_x64.lib",
            "$libRoot/vulkan/vulkan-1.lib",
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/freetype/freetype.lib'
          )
          $missing = @($required | Where-Object { !(Test-Path $_) })
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "MISSING $_" }
            throw 'Link libraries missing from checkout. They must be in git (git add -f).'
          }
          Write-Host 'Link libraries present.'

      - name: MSVC dev environment
        # setup-msbuild only puts MSBuild on PATH — it deliberately does NOT add
        # cl.exe. This action runs vcvarsall so `cl` below resolves.
        # Maintained fork of ilammy/msvc-dev-cmd; the upstream one is still on
        # node20 and GitHub force-runs it on node24 with a deprecation warning.
        # Every action below is pinned to a node24 release for the same reason.
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
          toolset: ${{ steps.toolchain.outputs.msvc }}
          sdk: ${{ env.WINDOWS_SDK_VERSION }}

      - name: Verify compiler environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VCToolsVersion.TrimEnd('\') -ne $env:MSVC_VERSION) { throw "Unexpected compiler: $env:VCToolsVersion" }
          if ($env:WindowsSDKVersion.TrimEnd('\') -ne $env:WINDOWS_SDK_VERSION) { throw "Unexpected SDK: $env:WindowsSDKVersion" }
          Write-Host "Runtime/tests/host: MSVC=$env:VCToolsVersion SDK=$env:WindowsSDKVersion"
          Get-Command cl.exe | Select-Object -ExpandProperty Source

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Module contract gate
        shell: pwsh
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/release/check-module-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compute build and tooling cache keys
        id: cache_keys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mochi = python -B tools/build/mochizuki-manifest.py --cache-key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sync = python -B tools/lmxxf-sync/test-cache.py key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "mochi=$mochi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sync=$sync" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore verified Mochizuki build
        uses: actions/cache@v5
        with:
          path: |
            exports/mochizuki-runtime/MochizukiNrRuntime.dll
            exports/mochizuki-runtime/build-manifest.json
            exports/mochizuki-runtime/dlssnr-amd/shaders
          key: mochi-${{ runner.os }}-${{ steps.cache_keys.outputs.mochi }}

      - name: Restore tooling test receipt
        uses: actions/cache@v5
        with:
          path: exports/test-cache/sync.json
          key: tooling-${{ runner.os }}-${{ steps.cache_keys.outputs.sync }}

      - name: Build or verify Mochizuki
        shell: pwsh
        run: |
          cmd /d /c tools\build\build-mochizuki-runtime.cmd --reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build host and run CI concurrently
        timeout-minutes: 25
        shell: pwsh
        run: |
          ./tools/build/build-ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package user zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          powershell -ExecutionPolicy Bypass -File tools\release\PACKAGE_RELEASE.ps1 `
            -Version $ver `
            -OptiDll "$env:BUILD_OUT\OptiScaler.dll" `
            -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist\OptScaler-NR-$ver.zip")) {
            throw "Package zip missing for $ver"
          }

      - name: Guard against proprietary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Independent CI tripwire: inspect the exact archive that Release uploads.
          $ver = '${{ steps.ver.outputs.version }}'
          $zipPath = "dist\OptScaler-NR-$ver.zip"
          $forbidden = '(?i)^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|dlssnr\.bin|version\.dll|dlssnr_on_amd_setup\.exe)$'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zipPath))
          try {
            $bad = @($archive.Entries |
              Where-Object { -not [string]::IsNullOrEmpty($_.Name) -and $_.Name -match $forbidden } |
              ForEach-Object { $_.FullName })
            $entryNames = @($archive.Entries | ForEach-Object { $_.Name })
          } finally {
            $archive.Dispose()
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "FORBIDDEN: $_" }
            throw 'Refusing to publish: proprietary/user-supplied binaries found in package zip.'
          }
          $required = @('OptiScaler.dll', 'LmxxfNrRuntime.dll', 'MochizukiNrRuntime.dll', 'OptiScaler.ini', 'Setup.ps1', 'Setup.bat')
          foreach ($r in $required) {
            if ($entryNames -notcontains $r) {
              throw "REQUIRED COMPONENT MISSING IN ZIP: $r"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OptScaler(NR)
          path: |
            dist/OptScaler-NR-${{ steps.ver.outputs.version }}.zip
            dist/OptScaler-NR-${{ steps.ver.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release metadata
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # Pre-release when tag name has an -alpha/-beta/-rc suffix (e.g. v1.9.1-alpha).
          # Formal tags like v1.9.1 stay latest/stable; plain substrings such as "source" do not count.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ### 1.10.4（相比 1.10.3.1）

            - **lmxxf 时序历史（防闪烁）支持 SR 前的 1–3 层 NR**：中间层只传递网络结果，最后一次真实网络导出时序辅助量，最终画面统一平滑。预测第 3 层仍只运行两次真实网络；切换层数时重置历史。
            - **完整同步 lmxxf 官方 PR12 主线闭包**：解除所有本地临时源码 Pin 与补丁覆盖，直接跟随官方最新合并提交，保留项目私有的时序历史算法与配置优先级。
            - 定向同步 OptiScaler 上游的 **DLSS/DLSSG 多副本生命周期**：新副本接管失败不再撤销旧副本，返回回调按模块隔离，卸载后安全退休。
            - 改进 **DX11 → DX12 + XeFG** 的交换链协调：确认参数等价时避免重复调整伴随交换链，正确处理窗口尺寸与 present 同步；GPU 等待失败时保留在用资源。
            - 减少启用 HUD/描述符跟踪时批量复制的重复查堆开销；单个描述符保留原路径。

            ### 1.10.3.1（相比 1.10.3）

            - 修复 **Page Up 性能叠加层（Performance Overlay / FPS Overlay）** 布局折叠异常
            - 默认字体大小由 `14.0` 调整为 `16.0`
            - 性能叠加层新增**独立字体调色盘（Text Color）**与重置按钮（Reset）
            - 勾选“跟随全局主题色（Use Theme Colors）”时，独立调色盘自动置灰禁用并提供悬浮说明

            **安装与对应后端权重准备**

            - 请完整解压 ZIP 至任意文件夹并运行新包的 `Setup.bat`。更新时推荐选择 **Y 先卸载**，重新使用包内默认配置。
            - **Daniel 0.6.0**：运行文件请前往 [Daniel 官方发布页](https://github.com/danielblnc/DLSS-NR-on-AMD/releases) 获取；`nvngx_dlssnr.dll` 310.8.0 请自行获取。
            - **lmxxf 0.41**：需自备 `native-game-tiled-assets` 权重目录，见 [原仓库](https://github.com/lmxxf/dlss5-on-amd-9070xt-porting) 或 [下载镜像](https://gofile.io/d/wRln0Pue)。
            - **Mochizuki 0.0.3**：从 `nvngx_dlssnr.dll` 310.8.0（与 Daniel 使用同一文件）提取权重，需要 Python 3.10+。
            - 如本次安装目标游戏文件夹内留存曾安装过的三后端有效权重，执行 `Setup.bat` 后可自动利用，并补回安装包内缺失的权重，使得日常更新本插件时无需反复重新拷贝。
            - 本包不含 NVIDIA DLL、Daniel 安装器或模型权重。

            **已知问题**

            - SR → NR 支持 DX12 及 DX11/Vulkan → DX12 桥接，不扩展原生 RR/Vulkan；不支持的纹理布局保留 SR 图像并显示原因。
            - lmxxf时序历史（抗闪烁）功能与 ViT 自适应复用继续互斥；SR 后NR路径暂不启用 lmxxf 时序历史。预测第 3 层使用最后一次真实网络的辅助量，画面仍可能存在近似误差，建议关闭预测第 3 层。
            - 可能与 ReShade 冲突（已知Mochizuki）。
            - Unity 游戏如遇 NR 丢失带来的闪烁，请尝试开启对应实验性开关（伊莫已默认开启）。

            **补充感谢**

            - 补充感谢 @Overclockers 在 1.10.3 版本贡献的 NR 激活时独立 XeFG 插帧倍率覆盖功能（[PR #3](https://github.com/TheAutomatic/dlss-5-amd-project/pull/3)）。注：仍需自备 XeFG 补丁，参考 README 对应“可选：3倍及以上多帧生成 (XeFG/DLSSG)”章节。
            - 各位 Bilibili 用户的测试与反馈。

            ---

            ### 1.10.4 (compared to 1.10.3.1)

            - **lmxxf temporal history (anti-flicker) now supports 1–3 NR passes before SR**. Intermediate passes forward network results; only the final real network exports temporal auxiliary data, and smoothing applies to the final image. Predicted pass 3 still uses two real network executions. Changing the pass count resets history.
            - **Synchronized with official lmxxf PR12 mainline closure**: Removed local temporary source pins and patches to follow the official merge, while preserving project-owned temporal history algorithms and configuration priority.
            - Selectively integrated OptiScaler **DLSS/DLSSG plugin lifetime improvements**: a failed new hook preserves the older instance, callbacks remain module-specific, and unloaded instances retire safely.
            - Improved swapchain coordination for **DX11 → DX12 + XeFG**: avoid redundant companion resize only when parameters are confirmed equivalent, handle window sizing and present synchronization, and preserve in-use resources when a GPU wait fails.
            - Reduced repeated heap lookups in batched descriptor copies when HUD/descriptor tracking is enabled; single-descriptor copies retain their original path.

            ### 1.10.3.1 (compared to 1.10.3)

            - Fixed layout collapse in the **Page Up Performance Overlay / FPS Overlay**
            - Updated default font size from `14.0` to `16.0`
            - Added an **independent Text Color picker** and Reset button for the Performance Overlay
            - Grayed out the overlay color picker with a tooltip when "Use Theme Colors" is enabled

            **Installation and backend model preparation**

            - Extract the complete ZIP into a folder of your choice and run the new package's `Setup.bat`. When upgrading, we recommend choosing **Y to uninstall first** and start with the package's default settings.
            - **Daniel 0.6.0**: obtain the runtime files from the [Daniel releases page](https://github.com/danielblnc/DLSS-NR-on-AMD/releases). Obtain `nvngx_dlssnr.dll` 310.8.0 separately.
            - **lmxxf 0.41**: provide `native-game-tiled-assets` weights from the [upstream repository](https://github.com/lmxxf/dlss5-on-amd-9070xt-porting) or [download mirror](https://gofile.io/d/wRln0Pue).
            - **Mochizuki 0.0.3**: extract the weights from `nvngx_dlssnr.dll` 310.8.0, the same file used by Daniel. Python 3.10+ is required.
            - If the game folder selected for this installation still contains valid weights from previous installations of any of the three backends, `Setup.bat` can reuse them and copy missing weights back into the installer folder, so you do not need to copy them manually again for routine plugin updates.
            - NVIDIA DLLs, the Daniel installer and model weights are not included.

            **Known issues**

            - SR → NR supports DX12 and the DX11/Vulkan-to-DX12 bridges; it does not add native RR/Vulkan support. Unsupported texture layouts preserve the SR image and report the reason.
            - lmxxf temporal history (anti-flicker) and adaptive ViT reuse remain mutually exclusive; lmxxf temporal history is unavailable in the post-SR NR path. Predicted pass 3 uses auxiliary data from the last real network execution and may introduce approximation artifacts; disabling predicted pass 3 is recommended.
            - May conflict with ReShade (confirmed with Mochizuki).
            - If NR dropping out causes flicker in a Unity game, try enabling the corresponding experimental option (enabled by default for Aniimo).

            **Additional thanks**

            - Special thanks to @Overclockers for contributing the NR-only XeFG multiplier override in version 1.10.3 ([PR #3](https://github.com/TheAutomatic/dlss-5-amd-project/pull/3)). Note: XeFG unlock files are still required; see the "Optional: 3x+ Frame Generation (XeFG/DLSSG)" section in README for details.
            - Thanks to all Bilibili users for testing and feedback.

            This archive does not include NVIDIA proprietary binaries, the danielblnc installer, or unauthorized model weights.

            See the included README for configuration details. Bug reports with logs are welcome.

            Source / 源码：[${{ github.sha }}](https://github.com/${{ github.repository }}/tree/${{ github.sha }})

      - name: Upload release asset with verified retries
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 20
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -B .github/scripts/publish_release_asset.py --tag "$env:RELEASE_TAG" --asset "dist/OptScaler-NR-$env:RELEASE_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
