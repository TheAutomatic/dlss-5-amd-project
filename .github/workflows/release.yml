# Build OptiScaler(NR) v2.0+ (Official OptiScaler + dlssnr-amd.asi + openrr-amd.asi + GUI Launcher)
# and attach Windows + Linux packages atomically to a GitHub Release.
#
# - Official OptiScaler, DLSSNR-AMD (+ CJK lang pack), OpenRR-ASI, and OptiPatcher.asi are fetched and
#   SHA-256-verified from upstream GitHub Releases using tools/build/upstream-pins.json during packaging.
# - On tag pushes, `prepare` creates a hidden Draft Release, `build` (Windows) and `linux` (Ubuntu)
#   run in parallel and stream their verified packages directly to that Draft Release (zero Actions
#   Artifact bounce), and `publish` verifies all 3 assets exist and flips draft=false atomically.
# - Does NOT package NVIDIA DLLs or extracted model weights.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      test_package:
        description: Build and upload a test ZIP (no Release)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Tag pushes only: verify tag integrity, generate release notes, and create a hidden Draft Release
  # so `build` and `linux` can upload directly without bouncing 700+ MB through Actions Artifacts.
  prepare:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
      linux_only: ${{ steps.ver.outputs.linux_only }}
      linux_arch: ${{ steps.ver.outputs.linux_arch }}
      keep_draft: ${{ steps.notes.outputs.keep_draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z._-]+$'; then echo "Invalid version: $v" >&2; exit 1; fi
          linux_only="false"
          linux_arch="all"
          case "$GITHUB_REF_NAME" in
            *-linux-all*)
              linux_only="true"
              linux_arch="all"
              ;;
            *-linux*)
              linux_only="true"
              linux_arch="x86_64"
              ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "linux_only=$linux_only" >> "$GITHUB_OUTPUT"
          echo "linux_arch=$linux_arch" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          ref="refs/tags/$tag"
          git fetch --force --no-tags origin "+${ref}:${ref}"
          obj_type="$(git cat-file -t "$ref" 2>/dev/null || true)"
          notes=""
          keep_draft="false"
          if [ "$obj_type" = "tag" ]; then
            raw="$(git for-each-ref "$ref" --format='%(contents)')"
            if printf '%s\n' "$raw" | grep -Eiq '(^|[[:space:]])\[draft\]([[:space:]]|$)'; then
              keep_draft="true"
            fi
            notes="$(python3 -B - "$raw" "$tag" <<'PY'
          import re, sys
          raw, tag = sys.argv[1], sys.argv[2]
          cleaned = re.sub(r'(?s)\r?\n-----BEGIN (?:PGP|SSH) SIGNATURE-----.*$', '', raw)
          cleaned = re.sub(r'(?im)^[ \t]*\[draft\][ \t]*\r?\n?', '', cleaned)
          cleaned = re.sub(r'(?i)[ \t]*\[draft\][ \t]*', ' ', cleaned).strip()
          if cleaned and cleaned != tag:
              print(cleaned)
          PY
            )"
          fi
          echo "keep_draft=$keep_draft" >> "$GITHUB_OUTPUT"
          if [ -z "$notes" ]; then
            if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || true)" = "true" ]; then
              git fetch --tags --unshallow origin
            else
              git fetch --tags origin
            fi
            prev_tag=""
            if git rev-parse --verify --quiet "${GITHUB_SHA}^" >/dev/null 2>&1; then
              prev_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
            fi
            if [ -n "$prev_tag" ]; then
              lines="$(git log --no-merges --pretty=format:'- %s (%h)' "${prev_tag}..${GITHUB_SHA}")"
            else
              lines="$(git log --no-merges --pretty=format:'- %s (%h)' "${GITHUB_SHA}" -n 20)"
            fi
            {
              echo "## Changes"
              echo
              if [ -n "$lines" ]; then
                printf '%s\n' "$lines"
              else
                echo "- Release $tag"
              fi
              if [ -n "$prev_tag" ]; then
                echo
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${tag}"
              fi
            } > exports_notes.tmp
            mkdir -p exports
            mv exports_notes.tmp exports/release-notes.md
          else
            mkdir -p exports
            printf '%s\n' "$notes" > exports/release-notes.md
          fi

      - name: Verify tag and create Draft Release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extra=()
          case "$RELEASE_TAG" in
            *-alpha*|*-beta*|*-rc*) extra+=(--prerelease);;
          esac
          rel_id="$(python3 -B .github/scripts/publish_release_asset.py \
            --tag "$RELEASE_TAG" \
            --prepare-draft "$GITHUB_SHA" \
            --body-file exports/release-notes.md \
            "${extra[@]}")"
          if ! [[ "$rel_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid release_id from prepare-draft: $rel_id" >&2
            exit 1
          fi
          echo "release_id=$rel_id" >> "$GITHUB_OUTPUT"
          echo "Draft release ready: id=$rel_id"

  build:
    needs: [prepare]
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag' && needs.prepare.result == 'success' && needs.prepare.outputs.linux_only != 'true'))
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
              $v = (Get-Content -LiteralPath VERSION -Raw).Trim()
          }
          if ($v -notmatch '^[0-9A-Za-z._-]+$') { throw "Invalid version: $v" }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $v += "-test-$env:GITHUB_RUN_NUMBER-$($env:GITHUB_SHA.Substring(0,8))" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh Wiki compatibility profiles (best effort, fallback to committed assets/)
        shell: pwsh
        run: |
          try {
            & ./tools/compat/update-wiki-profiles.ps1
          } catch {
            Write-Warning "Wiki profile refresh skipped, keeping committed assets/compatibility/proxy-profiles.json: $_"
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Cache upstream release archives
        uses: actions/cache@v6
        with:
          path: cache/downloads
          key: upstream-downloads-${{ runner.os }}-${{ hashFiles('tools/build/upstream-pins.json') }}
          restore-keys: |
            upstream-downloads-${{ runner.os }}-

      - name: Create ephemeral package signing certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/release/package-signing.ps1
          $cert = Get-PackageSigningCertificate -Ephemeral
          "PACKAGE_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package user zip (fetches verified OptiScaler/DLSSNR-AMD/OpenRR/OptiPatcher, compiles Launcher, signs & verifies)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File tools\release\PACKAGE_RELEASE.ps1 `
            -Version $ver `
            -RefreshOptiPatcher `
            -SigningThumbprint "$env:PACKAGE_SIGNING_THUMBPRINT" `
            -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist\OptiScaler-NR-Windows-$ver.zip")) {
            throw "Package zip missing for $ver"
          }

      - name: Remove ephemeral signing key
        if: ${{ always() && env.PACKAGE_SIGNING_THUMBPRINT != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PACKAGE_SIGNING_THUMBPRINT -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid ephemeral certificate identity' }
          Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Security/Microsoft.PowerShell.Security.psd1')
          Get-Item -LiteralPath "Cert:/CurrentUser/My/$env:PACKAGE_SIGNING_THUMBPRINT" -ErrorAction Stop | Out-Null
          Remove-Item -LiteralPath "Cert:/CurrentUser/My/$env:PACKAGE_SIGNING_THUMBPRINT" -DeleteKey -ErrorAction Stop

      - name: Guard against proprietary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          $zipPath = "dist\OptiScaler-NR-Windows-$ver.zip"
          $forbidden = '(?i)^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|dlssnr(?:-int4|-small)?\.bin|CC_(?:SMALL_FP8|SMALL_FP8_EXPERIMENTAL|SMALL_FP8_OPTIMIZED|SMALL_FP8_OPTIMIZED_INT4|SMALL_FP8_OPTIMIZED_INT4_SINK|SILVER_AARDWOLD|SILVER_AARDWOLD_OPTIMIZED|SILVER_AARDWOLD_OPTIMIZED_INT4)\.bin|pipeline\.cache|version\.dll|dlssnr_on_amd_setup\.exe)$'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zipPath))
          try {
            $bad = @($archive.Entries |
              Where-Object { -not [string]::IsNullOrEmpty($_.Name) -and $_.Name -match $forbidden } |
              ForEach-Object { $_.FullName })
            $entryPaths = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
          } finally {
            $archive.Dispose()
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "FORBIDDEN: $_" }
            throw 'Refusing to publish: proprietary/user-supplied binaries found in package zip.'
          }
          foreach ($req in @('OptiScaler.dll', 'OptiScaler.ini', 'OptiScalerNRLauncher.exe', 'Setup.ps1', 'install.sh', 'proxy-profiles.json', 'launcher-overrides.json', 'OptiScaler/plugins/dlssnr-amd.asi', 'OptiScaler/plugins/openrr-amd.asi', 'OptiScaler/plugins/OptiPatcher.asi', 'rtx-remix-mc/remixbridge.dll', 'Licenses/RTX-Remix-Minecraft-AMD-Patch_LICENSE.txt', 'Licenses/RTX-Remix-Minecraft-AMD-Patch_NOTICE.txt', 'Licenses/NVIDIA-rtx-remix-minecraft-Apache-2.0.txt', 'dlssnr-amd/aco/d3d12_outer.nra', 'dlssnr-amd/aco/rdna3/d3d12_outer.nra', 'dlssnr-amd/lang/zh-CN.txt', 'dlssnr-amd/lang/fonts/NotoSansCJKsc-Regular.ttf', 'model-tools/dlssnr_extract_model.exe', 'CC_SMALL_FP8_OPTIMIZED/CC_SMALL_FP8_OPTIMIZED.delta', 'CC_SILVER_AARDWOLD_OPTIMIZED/CC_SILVER_AARDWOLD_OPTIMIZED.delta', 'dlssnr-amd-optiscaler.ini', 'dlssnr-amd-optiscaler-renodx.ini', 'dlssnr-amd-standalone.ini', 'dlssnr-amd-addon.ini', 'standalone/dxgi.dll', 'standalone/vk-override/implicit_layer/dlssnr_standalone.json', 'reshade/ReShade64.dll', 'reshade/dlssnr_amd.addon64', 'reshade/ReShade32.dll', 'reshade/dlssnr_amd.addon32', 'reshade/ReShade.ini', 'reshade/ReShadePreset.ini', 'reshade/ReShadePreset-d3d9.ini', 'reshade/vk-override/implicit_layer/ReShade64.json', 'reshade/vk-override/implicit_layer/ReShade32.json', 'reshade/reshade-shaders/Shaders/DLSS5_Feed.fx', 'dxvk/d3d9.dll', 'dxvk/dxgi.dll', 'dxvk/x86/d3d9.dll', 'dxvk/x86/dxgi.dll', 'vulkan/vulkan-1.dll', 'vulkan/x86/vulkan-1.dll', 'openrr-amd.ini', 'openrr-amd/aco/gfx1201/openrr-d3d12-v1/manifest.msgpack', 'openrr-amd/aco/gfx1200/openrr-d3d12-v1/manifest.msgpack', 'openrr-amd/lang/zh-CN.txt', 'openrr-amd/lang/fonts/NotoSansCJKsc-Regular.ttf', 'LICENSE', 'NOTICE')) {
            if ($entryPaths -notcontains $req) { throw "REQUIRED COMPONENT MISSING IN ZIP: $req" }
          }

      - name: Upload tested package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: OptiScaler-NR-test-${{ github.run_id }}
          path: dist/OptiScaler-NR-Windows-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Windows asset directly to Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -B .github/scripts/publish_release_asset.py `
            --tag "$env:RELEASE_TAG" `
            --release-id "$env:RELEASE_ID" `
            --asset "dist/OptiScaler-NR-Windows-$env:RELEASE_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Linux packages: Mochizuki's upstream DLSSNR-AMD Linux release (x86_64 + i686, SHA-256 pinned under
  # "mochizukiLinux" in tools/build/upstream-pins.json) + CJK lang pack + official OptiScaler nightly + OpenRR + stdlib-only Python launcher.
  # Runs in parallel with Windows `build`; both upload directly to the Draft Release.
  linux:
    needs: [prepare]
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag' && needs.prepare.result == 'success'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(tr -d '[:space:]' < VERSION)"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z._-]+$'; then echo "Invalid version: $v" >&2; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="$v-test-$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:8}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache upstream Linux archives
        uses: actions/cache@v6
        with:
          path: cache/linux
          key: upstream-linux-${{ hashFiles('tools/build/upstream-pins.json') }}
          restore-keys: |
            upstream-linux-

      - name: Launcher unit tests
        shell: bash
        working-directory: tools/linux
        run: python3 -B launcher/selftest.py --unit-only -v

      - name: Ensure pigz and 7z for Linux packaging
        shell: bash
        run: |
          set -euo pipefail
          pkgs=()
          if ! command -v pigz >/dev/null 2>&1; then pkgs+=(pigz); fi
          if ! command -v 7z >/dev/null 2>&1 && ! command -v 7zz >/dev/null 2>&1; then pkgs+=(p7zip-full); fi
          if [ "${#pkgs[@]}" -gt 0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${pkgs[@]}"
          fi

      - name: Package Linux tarballs
        shell: bash
        env:
          LINUX_ARCH: ${{ needs.prepare.outputs.linux_arch || 'all' }}
        run: |
          set -euo pipefail
          bash tools/release/package-linux.sh --version '${{ steps.ver.outputs.version }}' --arch "$LINUX_ARCH" --out dist --cache cache/linux
          ls -la dist

      - name: Guard against proprietary files and self-test packages
        shell: bash
        env:
          LINUX_ARCH: ${{ needs.prepare.outputs.linux_arch || 'all' }}
        run: |
          set -euo pipefail
          ver='${{ steps.ver.outputs.version }}'
          work="$RUNNER_TEMP/linux-pkg"
          mkdir -p "$work"
          have_pigz=0
          command -v pigz >/dev/null 2>&1 && have_pigz=1
          verify_arch() {
            local arch=$1
            local name="OptiScaler-NR-Linux-$arch-$ver"
            local tgz="dist/$name.tar.gz"
            local arch_work="$work/pkg-$arch"
            local arch_tmp="$work/tmp-$arch"
            mkdir -p "$arch_work" "$arch_tmp"
            test -f "$tgz" && test -f "$tgz.sha256"
            (cd dist && sha256sum -c "$name.tar.gz.sha256")
            # Validate archive listing BEFORE extracting (via pigz when available) for forbidden names
            # and single top-level folder layout.
            local list_file="$work/list-$arch.txt"
            if [ "$have_pigz" -eq 1 ]; then
              pigz -dc "$tgz" | tar -tf - > "$list_file"
            else
              tar -tzf "$tgz" > "$list_file"
            fi
            python3 -B - "$list_file" "$name" "$tgz" <<'PY'
          import re, sys
          list_path, top, tgz = sys.argv[1], sys.argv[2], sys.argv[3]
          forbidden = re.compile(r'^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|dlssnr(?:-int4|-small)?\.bin|CC_(?:SMALL_FP8|SMALL_FP8_EXPERIMENTAL|SMALL_FP8_OPTIMIZED|SMALL_FP8_OPTIMIZED_INT4|SMALL_FP8_OPTIMIZED_INT4_SINK|SILVER_AARDWOLD|SILVER_AARDWOLD_OPTIMIZED|SILVER_AARDWOLD_OPTIMIZED_INT4)\.bin|pipeline\.cache|version\.dll|dlssnr_on_amd_setup\.exe)$', re.I)
          names = [line.rstrip('\r\n') for line in open(list_path, encoding='utf-8')]
          bad = [n for n in names if forbidden.match(n.rstrip('/').rsplit('/', 1)[-1])]
          stray = [n for n in names if n != top and n != top + '/' and not n.startswith(top + '/')]
          for n in bad:
              print('FORBIDDEN: ' + n)
          for n in stray:
              print('UNEXPECTED TOP-LEVEL ENTRY: ' + n)
          if bad or stray:
              sys.exit('Refusing to publish ' + tgz)
          PY
            if [ "$have_pigz" -eq 1 ]; then
              pigz -dc "$tgz" | tar -C "$arch_work" -xf -
            else
              tar -xzf "$tgz" -C "$arch_work"
            fi
            NR_E2E_TMP="$arch_tmp" python3 -B "$arch_work/$name/launcher/selftest.py" -v
            rm -rf -- "$arch_work" "$arch_tmp" "$list_file"
          }
          if [ "$LINUX_ARCH" = "all" ]; then
            arches=(x86_64 i686)
          else
            arches=("$LINUX_ARCH")
          fi
          pids=()
          logs=()
          cleanup() {
            if [ "${#pids[@]}" -gt 0 ]; then
              for p in "${pids[@]}"; do kill "$p" 2>/dev/null || true; done
              for p in "${pids[@]}"; do wait "$p" 2>/dev/null || true; done
            fi
          }
          trap cleanup EXIT
          # Schedule heavier x86_64 first alongside i686.
          for arch in "${arches[@]}"; do
            logf="$work/verify-$arch.log"
            logs+=("$logf")
            ( verify_arch "$arch" ) > "$logf" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            rc=0
            wait "${pids[$i]}" || rc=$?
            cat "${logs[$i]}"
            if [ "$rc" -ne 0 ] && [ "$failed" -eq 0 ]; then failed=$rc; fi
          done
          pids=()
          exit "$failed"

      - name: Upload tested Linux packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: OptiScaler-NR-Linux-test-${{ github.run_id }}
          path: |
            dist/OptiScaler-NR-Linux-*-${{ steps.ver.outputs.version }}.tar.gz
            dist/OptiScaler-NR-Linux-*-${{ steps.ver.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Linux assets directly to Draft Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          LINUX_ARCH: ${{ needs.prepare.outputs.linux_arch || 'all' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/linux-uploads"
          mkdir -p "$work"
          if [ "$LINUX_ARCH" = "all" ]; then
            assets=(
              "dist/OptiScaler-NR-Linux-x86_64-${RELEASE_VERSION}.tar.gz"
              "dist/OptiScaler-NR-Linux-i686-${RELEASE_VERSION}.tar.gz"
            )
          else
            assets=(
              "dist/OptiScaler-NR-Linux-${LINUX_ARCH}-${RELEASE_VERSION}.tar.gz"
            )
          fi
          pids=()
          logs=()
          cleanup() {
            if [ "${#pids[@]}" -gt 0 ]; then
              for p in "${pids[@]}"; do kill "$p" 2>/dev/null || true; done
              for p in "${pids[@]}"; do wait "$p" 2>/dev/null || true; done
            fi
          }
          trap cleanup EXIT
          for i in "${!assets[@]}"; do
            logf="$work/upload-$i.log"
            logs+=("$logf")
            python3 -B .github/scripts/publish_release_asset.py \
              --tag "$RELEASE_TAG" \
              --release-id "$RELEASE_ID" \
              --asset "${assets[$i]}" > "$logf" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            rc=0
            wait "${pids[$i]}" || rc=$?
            cat "${logs[$i]}"
            if [ "$rc" -ne 0 ] && [ "$failed" -eq 0 ]; then failed=$rc; fi
          done
          pids=()
          exit "$failed"

  # Atomic publish: runs only after required platform jobs uploaded their verified assets to the
  # Draft Release. Performs zero file transfers — just checks expected assets and flips draft=false.
  publish:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.prepare.result == 'success' &&
      needs.linux.result == 'success' &&
      (needs.prepare.outputs.linux_only == 'true' || needs.build.result == 'success')
    needs: [prepare, build, linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Publish Draft Release atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          LINUX_ONLY: ${{ needs.prepare.outputs.linux_only }}
          LINUX_ARCH: ${{ needs.prepare.outputs.linux_arch || 'all' }}
          KEEP_DRAFT: ${{ needs.prepare.outputs.keep_draft || 'false' }}
        run: |
          set -euo pipefail
          expect_args=()
          if [ "$LINUX_ONLY" != "true" ]; then
            expect_args+=(--expect-asset "OptiScaler-NR-Windows-${RELEASE_VERSION}.zip")
          fi
          if [ "$LINUX_ARCH" = "all" ]; then
            expect_args+=(
              --expect-asset "OptiScaler-NR-Linux-x86_64-${RELEASE_VERSION}.tar.gz"
              --expect-asset "OptiScaler-NR-Linux-i686-${RELEASE_VERSION}.tar.gz"
            )
          else
            expect_args+=(--expect-asset "OptiScaler-NR-Linux-${LINUX_ARCH}-${RELEASE_VERSION}.tar.gz")
          fi
          extra_args=()
          if [ "$KEEP_DRAFT" = "true" ]; then
            extra_args+=(--keep-draft)
          fi
          python3 -B .github/scripts/publish_release_asset.py \
            --tag "$RELEASE_TAG" \
            --publish-draft "$RELEASE_ID" \
            "${extra_args[@]}" \
            "${expect_args[@]}"
