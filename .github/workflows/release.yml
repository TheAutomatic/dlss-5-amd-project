# Build OptiScaler AMD pre-SR and attach the user zip to a GitHub Release.
#
# Source default is 3 NR slots (AmdSlots); AMD_SINGLESLOT only moves it to 1.
# Ordinary Release is the shipping configuration — do not add diagnostics.
#
# Does NOT package NVIDIA DLLs, NR weights, or the author's pass DLL.
#
# Dependencies (FFX / XeSS signed bins) come from the git submodules under
# external/. `submodules: recursive` below is what puts them in the workspace —
# they are *.dll, so they are deliberately not committed directly.
#
# Link inputs (freetype.lib, FSR2/FSR31 static libs, vulkan-1.lib, detours.lib)
# live under OptiScaler/library and external/freetype. They are tracked in git
# the same way upstream OptiScaler does (git add -f despite *.lib ignore).
#
# Runner: windows-latest. The benchmarked binaries were built with the v145
# toolset (VS 2026), so we pin PLATFORM_TOOLSET to match rather than letting the
# project's v143 fallback pick a different compiler than the one we benchmarked.
# The preflight step fails loudly if the image no longer ships v145.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version; leave empty to read VERSION'
        required: false
        default: ''

permissions:
  contents: write

env:
  PLATFORM_TOOLSET: v145
  # The MSVC toolchain the measured binaries were built with. The preflight picks
  # the exact installed 14.44.35207 and the build pins VCToolsVersion to it, so CI
  # produces the same compiler as the local build instead of whatever the image
  # happens to default to.
  MSVC_PREFIX: '14.44'
  MSVC_VERSION: '14.44.35207'
  WINDOWS_SDK_VERSION: '10.0.26100.0'
  BUILD_OUT: exports/release-ci

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($env:REQUESTED_VERSION) {
            $v = $env:REQUESTED_VERSION
          }
          if ($v -notmatch '^[0-9A-Za-z._-]+$') { throw "Refusing odd version string: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "resolved version: $v"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Toolchain preflight
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio: $vs"

          # Do NOT probe ...\MSBuild\Microsoft\VC\v*\...\PlatformToolsets by name.
          # That tree exists once per VS generation, each holds a different subset,
          # and picking one shows a misleading list: on the VS2026 image the first
          # match lists only v142 (pulled in for UWP), which reads as "v145 absent"
          # when it is in fact installed. MSVC's own directory is unambiguous.
          $msvcRoot = Join-Path $vs 'VC\Tools\MSVC'
          if (!(Test-Path $msvcRoot)) { throw "No MSVC toolchain directory at $msvcRoot" }
          $have = @(Get-ChildItem -LiteralPath $msvcRoot -Directory |
            Select-Object -ExpandProperty Name | Sort-Object)
          Write-Host "MSVC toolchains: $($have -join ', ')"
          # 14.44 is the toolchain the benchmarked binaries were built with.
          $pick = $have | Where-Object { $_ -eq $env:MSVC_VERSION } | Select-Object -First 1
          if (-not $pick) {
            throw "No MSVC $env:MSVC_VERSION toolchain on this image (have: $($have -join ', '))."
          }
          Write-Host "Using MSVC $pick (PlatformToolset=$env:PLATFORM_TOOLSET)"
          "msvc=$pick" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $deps = @(
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/xess/bin/libxess.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK-v2/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_dx12.dll'
          )
          foreach ($d in $deps) {
            if (!(Test-Path $d)) { throw "Submodule content missing: $d (did checkout fetch submodules?)" }
          }
          Write-Host 'Submodule dependencies present.'

      - name: Link-library preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same as upstream OptiScaler: these *.lib are tracked despite
          # .gitignore (git add -f). They are not in the FFX/XeSS submodules.
          $libRoot = 'OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/library'
          $required = @(
            "$libRoot/fsr2/ffx_fsr2_api_x64.lib",
            "$libRoot/vulkan/vulkan-1.lib",
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/freetype/freetype.lib'
          )
          $missing = @($required | Where-Object { !(Test-Path $_) })
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "MISSING $_" }
            throw 'Link libraries missing from checkout. They must be in git (git add -f).'
          }
          Write-Host 'Link libraries present.'

      - name: MSVC dev environment
        # setup-msbuild only puts MSBuild on PATH — it deliberately does NOT add
        # cl.exe. This action runs vcvarsall so `cl` below resolves.
        # Maintained fork of ilammy/msvc-dev-cmd; the upstream one is still on
        # node20 and GitHub force-runs it on node24 with a deprecation warning.
        # Every action below is pinned to a node24 release for the same reason.
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
          toolset: ${{ steps.toolchain.outputs.msvc }}
          sdk: ${{ env.WINDOWS_SDK_VERSION }}

      - name: Verify compiler environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VCToolsVersion.TrimEnd('\') -ne $env:MSVC_VERSION) { throw "Unexpected compiler: $env:VCToolsVersion" }
          if ($env:WindowsSDKVersion.TrimEnd('\') -ne $env:WINDOWS_SDK_VERSION) { throw "Unexpected SDK: $env:WindowsSDKVersion" }
          Write-Host "Runtime/tests/host: MSVC=$env:VCToolsVersion SDK=$env:WindowsSDKVersion"
          Get-Command cl.exe | Select-Object -ExpandProperty Source

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Module contract gate
        shell: pwsh
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/release/check-module-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: No-GPU regression suites
        timeout-minutes: 20
        shell: pwsh
        run: |
          cmd /d /c tests\run-all.cmd --tier ci --out exports\release-ci\tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force exports/lmxxf-runtime | Out-Null
          Copy-Item -LiteralPath exports/release-ci/tests/runtime/LmxxfNrRuntime.dll -Destination exports/lmxxf-runtime/LmxxfNrRuntime.dll
          Copy-Item -LiteralPath exports/release-ci/tests/runtime-ci.sha256 -Destination exports/lmxxf-runtime/runtime-ci.sha256

      - name: Build OptiScaler Release (default = multi-slot)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Trailing *forward* slash on SolutionDir/OutDir/IntDir is required:
          # the project concatenates $(SolutionDir)external\... with no extra
          # separator, and a trailing backslash inside /p:Value="...\" makes
          # MSBuild swallow the closing quote. OutDir without a slash also
          # collapsed obj + filename (OptiScaler.pch).
          $slnDir = "$PWD/OptiScaler-DLSSNR-PreSR-Multipass-main/"
          $outDir = "$PWD/$env:BUILD_OUT/"
          # PreBuildEvent runs: it generates resource_build_{date,commit}.h, which
          # resource.h includes in Release and which are NOT in git.
          # PostBuildEvent stays off: it copies a README this fork does not have.
          msbuild "$slnDir/OptiScaler/OptiScaler.vcxproj" `
            /m:4 /t:Build /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=$env:PLATFORM_TOOLSET `
            /p:VCToolsVersion=${{ steps.toolchain.outputs.msvc }} `
            /p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK_VERSION `
            /p:PostBuildEventUseInBuild=false `
            /p:SolutionDir="$slnDir" `
            /p:OutDir="$outDir" `
            /p:IntDir="${outDir}obj/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:BUILD_OUT/OptiScaler.dll")) {
            throw "Build did not produce $env:BUILD_OUT/OptiScaler.dll"
          }

      - name: Package user zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          powershell -ExecutionPolicy Bypass -File tools\release\PACKAGE_RELEASE.ps1 `
            -Version $ver `
            -OptiDll "$env:BUILD_OUT\OptiScaler.dll" `
            -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist\OptiScaler-AMD-PreSR-$ver.zip")) {
            throw "Package zip missing for $ver"
          }

      - name: Guard against proprietary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Independent CI tripwire: inspect the exact archive that Release uploads.
          $ver = '${{ steps.ver.outputs.version }}'
          $zipPath = "dist\OptiScaler-AMD-PreSR-$ver.zip"
          $forbidden = '(?i)^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|dlssnr\.bin|version\.dll|dlssnr_on_amd_setup\.exe)$'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zipPath))
          try {
            $bad = @($archive.Entries |
              Where-Object { -not [string]::IsNullOrEmpty($_.Name) -and $_.Name -match $forbidden } |
              ForEach-Object { $_.FullName })
            $entryNames = @($archive.Entries | ForEach-Object { $_.Name })
          } finally {
            $archive.Dispose()
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "FORBIDDEN: $_" }
            throw 'Refusing to publish: proprietary/user-supplied binaries found in package zip.'
          }
          $required = @('OptiScaler.dll', 'LmxxfNrRuntime.dll', 'MochizukiNrRuntime.dll', 'OptiScaler.ini', 'Setup.ps1', 'Setup.bat')
          foreach ($r in $required) {
            if ($entryNames -notcontains $r) {
              throw "REQUIRED COMPONENT MISSING IN ZIP: $r"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OptiScaler-AMD-PreSR
          path: |
            dist/OptiScaler-AMD-PreSR-${{ steps.ver.outputs.version }}.zip
            dist/OptiScaler-AMD-PreSR-${{ steps.ver.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release metadata
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # Pre-release when tag name has an -alpha/-beta/-rc suffix (e.g. v1.9.1-alpha).
          # Formal tags like v1.9.1 stay latest/stable; plain substrings such as "source" do not count.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          body: |
            ### 1.10.0 (compared to 1.9.9.1)

            - Updated lmxxf to pinned 0.40 source (c81a88bc), adding free resolution, fast numerics and 1/2/3 network passes. Defaults are all 71 blocks, fast numerics on, free resolution on and one pass.
            - Added Overall Intensity and Residual Stabilizer for all three AMD backends. Stabilization requires valid motion/depth and is off by default.
            - Added optional asynchronous lmxxf NR GPU, encode/decode and output-effect timings in Ins and the Page Up/Page Down overlay. Measurement and timing logs are off by default; summaries are rate-limited.
            - Added the Mochizuki Vulkan backend for Windows / RDNA4, with separate model controls, compilation progress and model extraction in Setup.
            - Setup reports detected weights; Ins shows missing model/runtime dependencies. Unsupported or invalid Mochizuki model inputs receive actionable setup guidance.
            - Fixed Mochizuki shutdown waiting on unrelated game queue work after its own recordings have completed, avoiding a possible stall when disabling NR or switching backends.
            - NR settings now follow an Input / Model / Output flowchart with page-scoped resets.
            - Reorganized NR settings and corrected reset scope. NR toggle now defaults to End; removed the F8 ViT shortcut.
            - Added a resizable, screen-bounded Ins window with corner anchoring, a fixed compact graph/footer area, and persistent window size.
            - Removed a redundant lmxxf input copy through shared input storage and disabled unused tile generation. These changes do not imply a fixed FPS improvement in every game.
            - Added a bounded startup log diagnostic when no supported upscaler route reaches OptiScaler.

            **Daniel backend**

            Download the runtime and weights separately from the [Daniel releases page](https://github.com/danielblnc/DLSS-NR-on-AMD/releases). Daniel 0.6.0 remains supported.

            **lmxxf backend**

            Weight files: [lmxxf upstream repository](https://github.com/lmxxf/dlss5-on-amd-9070xt-porting) or [download mirror](https://gofile.io/d/wRln0Pue).

            **Mochizuki backend**

            Supply your own supported `nvngx_dlssnr.dll` 310.8.0 and Python 3.10+ for Setup extraction, or an existing valid `dlssnr-amd/dlssnr.bin`. The archive contains neither file.

            **Updating and notes**

            - Install and overwrite the complete package; host and runtime must match. Old lmxxf ABI fallback is not supported.
            - Free resolution can increase GPU time and memory substantially at higher inputs; multiple passes cost roughly N times the network work. Keeping the old INI preserves explicit previous settings.
            - Overall Intensity at 0 shows the original image but still runs NR; disable NR to save model computation.
            - NR GPU timing is not whole-frame latency. Stabilization and measurement add work; actual game performance and image quality depend on the scene and settings.
            - Daniel model caches may remain allocated after NR is disabled until the game exits.

            **This archive does not include NVIDIA proprietary binaries, the danielblnc installer, or unauthorized model weights.**

            See the included README for configuration details. Bug reports with logs are welcome.

      - name: Upload release asset with verified retries
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 20
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -B .github/scripts/publish_release_asset.py --tag "$env:RELEASE_TAG" --asset "dist/OptiScaler-AMD-PreSR-$env:RELEASE_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
