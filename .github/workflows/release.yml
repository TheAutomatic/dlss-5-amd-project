# Build OptiScaler AMD pre-SR and attach the user zip to a GitHub Release.
#
# Source default is multi-slot (r18 / AMD_SINGLESLOT inverted). Ordinary Release
# is the shipping configuration — do not add AMD_MULTISLOT or diagnostics.
#
# Does NOT package NVIDIA DLLs, NR weights, or the author's pass DLL.
#
# Dependencies (FFX / XeSS signed bins) come from the git submodules under
# external/. `submodules: recursive` below is what puts them in the workspace —
# they are *.dll, so they are deliberately not committed directly.
#
# Link inputs (freetype.lib, FSR2/FSR31 static libs, vulkan-1.lib, detours.lib)
# live under OptiScaler/library and external/freetype. They are *.lib and are
# gitignored — not in those submodules. CI fails the Link-library preflight
# unless repository variable LIBS_ARCHIVE_URL points at a zip that provides
# that tree (or the files already sit in the workspace).
#
# Runner: windows-latest. The measured r18 binary was built with the v145
# toolset (VS 2026), so we pin PLATFORM_TOOLSET to match rather than letting the
# project's v143 fallback pick a different compiler than the one we benchmarked.
# The preflight step fails loudly if the image no longer ships v145.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Product version (fork-runtime), e.g. 1.8.0-0.3.0'
        required: false
        default: '1.8.0-0.3.0'

permissions:
  contents: write

env:
  PLATFORM_TOOLSET: v145
  BUILD_OUT: exports/release-ci

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '1.8.0-0.3.0'
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          } elseif ('${{ github.event.inputs.version }}') {
            $v = '${{ github.event.inputs.version }}'
          }
          if ($v -notmatch '^[0-9A-Za-z._-]+$') { throw "Refusing odd version string: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "resolved version: $v"

      - name: Toolchain preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio: $vs"
          # Enumerate toolset *subdirectories*. A bare -Directory on
          # ...\PlatformToolsets yields the folder itself (Name=PlatformToolsets),
          # which made this check fail even when v145 was installed.
          $toolsetRoot = Get-ChildItem -Path "$vs\MSBuild\Microsoft\VC\v*\Platforms\x64\PlatformToolsets" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $toolsetRoot) { throw "No PlatformToolsets directory under $vs" }
          $sets = Get-ChildItem -LiteralPath $toolsetRoot.FullName -Directory |
            Select-Object -ExpandProperty Name
          Write-Host "Available toolsets: $($sets -join ', ')"
          if ($sets -notcontains $env:PLATFORM_TOOLSET) {
            throw "Toolset $env:PLATFORM_TOOLSET not found on this image (have: $($sets -join ', ')). Pin runs-on to an image that ships it, or change PLATFORM_TOOLSET."
          }
          $deps = @(
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/xess/bin/libxess.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK-v2/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_dx12.dll'
          )
          foreach ($d in $deps) {
            if (!(Test-Path $d)) { throw "Submodule content missing: $d (did checkout fetch submodules?)" }
          }
          Write-Host 'Submodule dependencies present.'

      - name: Link-library preflight
        shell: pwsh
        env:
          # Optional zip URL that contains OptiScaler\library\*.lib and
          # external\freetype\freetype.lib (and similar). These are gitignored
          # and not carried by the FFX/XeSS submodules.
          LIBS_ARCHIVE_URL: ${{ vars.LIBS_ARCHIVE_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $libRoot = 'OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/library'
          $required = @(
            "$libRoot/fsr2/ffx_fsr2_api_x64.lib",
            "$libRoot/vulkan/vulkan-1.lib",
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/freetype/freetype.lib'
          )
          $missing = @($required | Where-Object { !(Test-Path $_) })
          if ($missing.Count -gt 0 -and $env:LIBS_ARCHIVE_URL) {
            Write-Host "Fetching link libraries from LIBS_ARCHIVE_URL..."
            $cache = Join-Path $env:RUNNER_TEMP 'opti-libs'
            New-Item -ItemType Directory -Force -Path $cache | Out-Null
            $zip = Join-Path $cache 'libs.zip'
            Invoke-WebRequest -Uri $env:LIBS_ARCHIVE_URL -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $cache -Force
            # Accept either a zip that already has the tree, or a flat dump.
            foreach ($rel in @(
              'OptiScaler-DLSSNR-PreSR-Multipass-main',
              '.'
            )) {
              $src = Join-Path $cache $rel
              if (Test-Path $src) {
                Copy-Item -Path (Join-Path $src '*') -Destination . -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
            $missing = @($required | Where-Object { !(Test-Path $_) })
          }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "MISSING $_" }
            throw @"
Link libraries are not in git (*.lib ignored) and are not provided by the
FFX/XeSS submodules. Set repository variable LIBS_ARCHIVE_URL to a zip that
contains at least:
  OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/library/**
  OptiScaler-DLSSNR-PreSR-Multipass-main/external/freetype/freetype.lib
Do not put NVIDIA/author-pass/weights into that archive.
"@
          }
          Write-Host 'Link libraries present.'

      - name: MSVC dev environment
        # setup-msbuild only puts MSBuild on PATH — it deliberately does NOT add
        # cl.exe. This action runs vcvarsall so `cl` below resolves.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: State-machine regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:BUILD_OUT | Out-Null
          cl /nologo /std:c++20 /EHsc /W4 tests\amd_submission_state.cpp `
            /Fe"$env:BUILD_OUT\amd_submission_state.exe" `
            /Fo"$env:BUILD_OUT\amd_submission_state.obj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:BUILD_OUT\amd_submission_state.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build OptiScaler Release (default = multi-slot)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Trailing *forward* slash on SolutionDir/OutDir/IntDir is required:
          # the project concatenates $(SolutionDir)external\... with no extra
          # separator, and a trailing backslash inside /p:Value="...\" makes
          # MSBuild swallow the closing quote. OutDir without a slash also
          # collapsed obj + filename (OptiScaler.pch).
          $slnDir = "$PWD/OptiScaler-DLSSNR-PreSR-Multipass-main/"
          $outDir = "$PWD/$env:BUILD_OUT/"
          # PreBuildEvent runs: it generates resource_build_{date,commit}.h, which
          # resource.h includes in Release and which are NOT in git.
          # PostBuildEvent stays off: it copies a README this fork does not have.
          msbuild "$slnDir/OptiScaler/OptiScaler.vcxproj" `
            /m:4 /t:Build /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=$env:PLATFORM_TOOLSET `
            /p:PostBuildEventUseInBuild=false `
            /p:SolutionDir="$slnDir" `
            /p:OutDir="$outDir" `
            /p:IntDir="${outDir}obj/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:BUILD_OUT/OptiScaler.dll")) {
            throw "Build did not produce $env:BUILD_OUT/OptiScaler.dll"
          }

      - name: Package user zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          powershell -ExecutionPolicy Bypass -File tools\PACKAGE_RELEASE.ps1 `
            -Version $ver `
            -OptiDll "$env:BUILD_OUT\OptiScaler.dll" `
            -OutDir dist
          if (!(Test-Path "dist\OptiScaler-AMD-PreSR-$ver.zip")) {
            throw "Package zip missing for $ver"
          }

      - name: Guard against proprietary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same tripwire as PACKAGE_RELEASE.ps1, applied to the zip contents too.
          $bad = Get-ChildItem dist\OptiScaler-AMD-PreSR-* -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|version\.dll|dlssnr_on_amd_setup\.exe)$' }
          if ($bad) {
            $bad | ForEach-Object { Write-Host $_.FullName }
            throw 'Refusing to publish: proprietary/user-supplied binaries found in dist\'
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-AMD-PreSR
          path: |
            dist/*.zip
            dist/**/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          generate_release_notes: true
          body: |
            OptiScaler AMD pre-SR **${{ steps.ver.outputs.version }}** (every-frame multi-slot).

            - Built on **[OptiScaler](https://github.com/optiscaler/OptiScaler)** (GPL-3.0) and **[dlss-5-amd](https://github.com/MatheusGViana/dlss-5-amd-project)**.
            - Corresponding source for this binary: `${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}`
            - Requires **[DLSS-NR on AMD](https://github.com/danielblnc/DLSS-NR-on-AMD) 0.3.0** + local weights (not bundled).
            - No NVIDIA DLLs / weights / author pass DLL in this zip.
            - Xbox/MS Store: run `Setup.bat` against `C:\XboxGames\<Game>\Content`.
            - See README inside the zip.
