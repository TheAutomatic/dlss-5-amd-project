# Build OptScaler(NR) and attach the user zip to a GitHub Release.
#
# Source default is 3 NR slots (AmdSlots); AMD_SINGLESLOT only moves it to 1.
# Ordinary Release is the shipping configuration — do not add diagnostics.
#
# Does NOT package NVIDIA DLLs, NR weights, or the author's pass DLL.
#
# Dependencies (FFX / XeSS signed bins) come from the git submodules under
# external/. `submodules: recursive` below is what puts them in the workspace —
# they are *.dll, so they are deliberately not committed directly.
#
# Link inputs (freetype.lib, FSR2/FSR31 static libs, vulkan-1.lib, detours.lib)
# live under OptiScaler/library and external/freetype. They are tracked in git
# the same way upstream OptiScaler does (git add -f despite *.lib ignore).
#
# Runner: windows-latest. The benchmarked binaries were built with the v145
# toolset (VS 2026), so we pin PLATFORM_TOOLSET to match rather than letting the
# project's v143 fallback pick a different compiler than the one we benchmarked.
# The preflight step fails loudly if the image no longer ships v145.

name: release

on:
  push:
    tags:
      - 'v*'
  # Manual runs can test and upload a package without creating a Release.
  workflow_dispatch:
    inputs:
      test_package:
        description: Build, run full regression and upload a test ZIP (no Release)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PLATFORM_TOOLSET: v145
  # The MSVC toolchain the measured binaries were built with. The preflight picks
  # the exact installed 14.44.35207 and the build pins VCToolsVersion to it, so CI
  # produces the same compiler as the local build instead of whatever the image
  # happens to default to.
  MSVC_PREFIX: '14.44'
  MSVC_VERSION: '14.44.35207'
  WINDOWS_SDK_VERSION: '10.0.26100.0'
  BUILD_OUT: exports/release-ci

jobs:
  build:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.test_package)
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Tag pushes are authoritative: the tag name IS the version.
          # VERSION file is only the fallback for non-tag (branch/dispatch) builds.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
              $v = (Get-Content -LiteralPath VERSION -Raw).Trim()
          }
          if ($v -notmatch '^[0-9A-Za-z._-]+$') { throw "Invalid version: $v" }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $v += "-test-$env:GITHUB_RUN_NUMBER-$($env:GITHUB_SHA.Substring(0,8))" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $body = @'
          ### v1.13.4.2 (对比 v1.13.4.1)
 
          修复与可用性版本：解决安装被崩溃上报残留进程阻断、正式版默认没有日志，以及光线再生切换后的资源滞留。
 
          ## 安装器
 
          - **修复安装被"游戏仍在运行"误判而中止**：崩溃上报类残留进程（Crashpad、Unreal/Unity 崩溃处理器、WER）不再阻断安装；其余进程改为按映像所在目录判定，别处的同名进程不再误伤。真正的文件占用检测保持不变。
          - **ASI 插件加载默认开启**：安装时统一写入 `[Plugins] LoadAsiPlugins=true`（本产品随包提供 ASI 组件），启动器不再提供该勾选框。如需关闭，请在该游戏的 ini 中手动设为 `false`；注意 `auto` 在宿主里仍按 `false` 处理。
          - 包内容整理：Python 模型提取器移入 `model-tools/`（原生提取仍是主路径，Python 仅为降级兜底），同时修复其配套工具目录的解析。
 
          ## 日志
 
          - **正式版默认写日志**：`OptiScaler.log` 不再需要手动开启（此前只有预发布构建会强制打开）；需要完全关闭文件日志时设 `LogToFile=false`。
          - 重复告警折叠：Streamline 的每帧类告警（如 `Exceeded VRAM budget`）与重复绑定信息，在默认日志等级下只记录少量样本并附 `[repeated Nx]` 汇总；`LogLevel=1` 仍输出全部原始内容。
 
          ## FSR 光线再生（实验）
 
          - 切换 RR ↔ 普通超分后，旧的降噪上下文与历史缓冲会被正确回收（此前游戏未释放旧 feature 时会在切换后滞留显存）。
          - 首帧自动信号分类引起的上下文重建不再记为错误（属正常的一次性行为）。
          - 日志中的 `normals bind` 改为按不同绑定去重，不再每帧重复输出。
 
          ### 安装与权重
 
          - 完整解压并运行新包 `Setup.bat` 覆盖安装。
          - Mochizuki 0.0.7、lmxxf 0.44：启动器从您自备的官方原版 `nvngx_dlssnr.dll` 提取模型；Daniel 0.6.0 需额外获取运行文件。
          - FSR 光线再生不需要额外模型或 DLL。
 
          ### 已知问题
 
          - 4K 输出 + FSR 光线再生时，Streamline 会周期性报告 `Exceeded VRAM budget`：属于告警性估算，实测不影响帧率；默认日志等级下已被折叠。
          - 光线再生与普通超分的切换依赖游戏重建 NGX feature；若某游戏的开关不触发重建，需要重进关卡或重启游戏后才生效。
          - FSR 光线再生为实验功能，默认关闭。
          - 需开启 DXGI 伪装才能在多数游戏中看到 DLSS/RR 选项；部分游戏开伪装后可能报"不支持的 GPU"。
          - 相比游戏内建 FSR 路径慢约 1.5–3 fps（实测《红色沙漠》约 20 vs 22 fps，1440p→4K）。分段性能测量工具在准备中。
          - 日志出现 `open_query` 拒绝：菜单"兼容性与调度"同时开启 **Allow enhanced barriers** 与 **Split query splice**（实验）。
          - RenoDX 无法与人物保护功能同时生效；Linux/Proton 支持为实验性。
 
          ---
 
          ### v1.13.4.2 (vs v1.13.4.1)
 
          Fix and usability release: installs no longer fail on leftover crash-reporter processes, shipping builds write a log by default, and Ray Regeneration no longer keeps resources alive across a switch.
 
          ## Installer
 
          - **Fixed installs aborting with "a game process is still running"**: leftover crash reporters (Crashpad, Unreal/Unity crash handlers, WER) no longer block an install; every other process is matched by where its image lives, so a same-named process elsewhere is ignored. Real file locks are still detected exactly as before.
          - **ASI plugin loading is on by default**: every install writes `[Plugins] LoadAsiPlugins=true` (an ASI component ships with this product) and the launcher no longer offers the checkbox. To turn it off, set the game ini to `false` by hand; note that `auto` still resolves to `false` in the host.
          - Package layout: the Python model extractor moved into `model-tools/` (native extraction remains the primary path; Python is only the degraded fallback), and its companion tool directory lookup was fixed.
 
          ## Logging
 
          - **Shipping builds now write a log by default**: `OptiScaler.log` no longer needs to be enabled by hand (previously only pre-release builds forced it on). Set `LogToFile=false` to skip the file entirely.
          - Repeated advisories are collapsed: per-frame Streamline warnings (such as `Exceeded VRAM budget`) and repeated binding lines log a few samples plus a `[repeated Nx]` summary at the default level; `LogLevel=1` still writes every raw line.
 
          ## FSR Ray Regeneration (experimental)
 
          - After switching between RR and plain upscaling, the old denoiser context and its history buffers are now reclaimed (previously they stayed resident when the game did not release the old feature).
          - The context rebuild caused by first-frame automatic signal classification is no longer reported as an error (it is a one-time, expected step).
          - The `normals bind` log line is de-duplicated per distinct binding instead of repeating every frame.
 
          ### Installation and models
 
          - Extract the full package and run `Setup.bat` as an overwrite install.
          - Mochizuki 0.0.7, lmxxf 0.44: the launcher extracts models from your own official `nvngx_dlssnr.dll`; Daniel 0.6.0 additionally fetches runtime files.
          - FSR Ray Regeneration needs no extra models or DLLs.
 
          ### Known issues
 
          - With 4K output and Ray Regeneration, Streamline periodically reports `Exceeded VRAM budget`: it is an advisory estimate that did not affect measured frame rate, and it is collapsed at the default log level.
          - Switching between Ray Regeneration and plain upscaling relies on the game recreating its NGX feature; if a game's toggle does not recreate it, the change takes effect only after a level reload or restart.
          - FSR Ray Regeneration is experimental and off by default.
          - DXGI spoofing is required for most games to expose their DLSS/RR option; some titles may show an "unsupported GPU" error with spoofing on.
          - Roughly 1.5–3 fps slower than the game's native FSR path (measured in Crimson Desert: ~20 vs 22 fps, 1440p→4K). Per-pass measurement tooling is in preparation.
          - Logs showing `open_query` rejections: enable **Allow enhanced barriers** and **Split query splice** together under Compatibility & Scheduling (experimental).
          - RenoDX cannot be combined with person protection; Linux/Proton support is experimental.
          '@
          if ([string]::IsNullOrWhiteSpace($body)) { throw 'Empty release notes' }
          $headings = [regex]::Matches($body, '(?m)^### v([^\s]+)(?:[ \t]+[^\r\n]*)?\r?$')
          if (!$headings.Count) { throw "Missing release notes version heading" }
          foreach ($heading in $headings) {
            if ($heading.Groups[1].Value -cne $env:RELEASE_VERSION) { throw "Release notes version mismatch" }
          }
          $body += "`nSource / 源码：[$env:SOURCE_SHA](https://github.com/$env:SOURCE_REPO/tree/$env:SOURCE_SHA)`n"
          New-Item -ItemType Directory -Force exports | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'exports/release-notes.md'), $body, [Text.UTF8Encoding]::new($false))
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reject moved published tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -B .github/scripts/publish_release_asset.py --tag "$env:RELEASE_TAG" --verify-source "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Toolchain preflight
        id: toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          Write-Host "Visual Studio: $vs"

          # Do NOT probe ...\MSBuild\Microsoft\VC\v*\...\PlatformToolsets by name.
          # That tree exists once per VS generation, each holds a different subset,
          # and picking one shows a misleading list: on the VS2026 image the first
          # match lists only v142 (pulled in for UWP), which reads as "v145 absent"
          # when it is in fact installed. MSVC's own directory is unambiguous.
          $msvcRoot = Join-Path $vs 'VC\Tools\MSVC'
          if (!(Test-Path $msvcRoot)) { throw "No MSVC toolchain directory at $msvcRoot" }
          $have = @(Get-ChildItem -LiteralPath $msvcRoot -Directory |
            Select-Object -ExpandProperty Name | Sort-Object)
          Write-Host "MSVC toolchains: $($have -join ', ')"
          # 14.44 is the toolchain the benchmarked binaries were built with.
          $pick = $have | Where-Object { $_ -eq $env:MSVC_VERSION } | Select-Object -First 1
          if (-not $pick) {
            throw "No MSVC $env:MSVC_VERSION toolchain on this image (have: $($have -join ', '))."
          }
          Write-Host "Using MSVC $pick (PlatformToolset=$env:PLATFORM_TOOLSET)"
          "msvc=$pick" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $deps = @(
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/xess/bin/libxess.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/xess/bin/libxess_fg.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/xess/bin/libxell.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/directx_agility_sdk/lib/D3D12Core.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK/PrebuiltSignedDLL/amd_fidelityfx_vk.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK-v2/Kits/FidelityFX/signedbin/amd_fidelityfx_loader_dx12.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK-v2/Kits/FidelityFX/signedbin/amd_fidelityfx_framegeneration_dx12.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK-v2/Kits/FidelityFX/signedbin/amd_fidelityfx_upscaler_dx12.dll',
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/FidelityFX-SDK-v2/Kits/FidelityFX/signedbin/amd_fidelityfx_denoiser_dx12.dll'
          )
          foreach ($d in $deps) {
            if (!(Test-Path $d)) { throw "Submodule content missing: $d (did checkout fetch submodules?)" }
          }
          Write-Host 'Submodule dependencies present.'

      - name: Link-library preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same as upstream OptiScaler: these *.lib are tracked despite
          # .gitignore (git add -f). They are not in the FFX/XeSS submodules.
          $libRoot = 'OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/library'
          $required = @(
            "$libRoot/fsr2/ffx_fsr2_api_x64.lib",
            "$libRoot/vulkan/vulkan-1.lib",
            'OptiScaler-DLSSNR-PreSR-Multipass-main/external/freetype/freetype.lib'
          )
          $missing = @($required | Where-Object { !(Test-Path $_) })
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Host "MISSING $_" }
            throw 'Link libraries missing from checkout. They must be in git (git add -f).'
          }
          Write-Host 'Link libraries present.'

      - name: MSVC dev environment
        # setup-msbuild only puts MSBuild on PATH — it deliberately does NOT add
        # cl.exe. This action runs vcvarsall so `cl` below resolves.
        # Maintained fork of ilammy/msvc-dev-cmd; the upstream one is still on
        # node20 and GitHub force-runs it on node24 with a deprecation warning.
        # Every action below is pinned to a node24 release for the same reason.
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
          toolset: ${{ steps.toolchain.outputs.msvc }}
          sdk: ${{ env.WINDOWS_SDK_VERSION }}

      - name: Verify compiler environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VCToolsVersion.TrimEnd('\') -ne $env:MSVC_VERSION) { throw "Unexpected compiler: $env:VCToolsVersion" }
          if ($env:WindowsSDKVersion.TrimEnd('\') -ne $env:WINDOWS_SDK_VERSION) { throw "Unexpected SDK: $env:WindowsSDKVersion" }
          Write-Host "Runtime/tests/host: MSVC=$env:VCToolsVersion SDK=$env:WindowsSDKVersion"
          Get-Command cl.exe | Select-Object -ExpandProperty Source

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Module contract gate
        shell: pwsh
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/release/check-module-contract.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: FSRD shader mirror verification
        shell: pwsh
        run: |
          python -B OptiScaler-DLSSNR-PreSR-Multipass-main/OptiScaler/shaders/shader_tools/verify_fsrd_mirrors.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compute build cache key
        id: cache_keys
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mochi = python -B tools/build/mochizuki-manifest.py --cache-key
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "mochi=$mochi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore verified Mochizuki build
        uses: actions/cache@v5
        with:
          path: |
            exports/mochizuki-runtime/MochizukiNrRuntime.dll
            exports/mochizuki-runtime/build-manifest.json
            exports/mochizuki-runtime/dlssnr-amd/shaders
            exports/mochizuki-runtime/dlssnr-amd/aco
            exports/mochizuki-runtime/dlssnr-amd/int4/settings.txt
            exports/mochizuki-runtime/dlssnr-amd/int4/shaders
            exports/mochizuki-runtime/dlssnr-amd/int4/vit
            exports/mochizuki-runtime/dlssnr-amd/int4/swin
            exports/mochizuki-runtime/model-tools
          key: mochi-${{ runner.os }}-${{ steps.cache_keys.outputs.mochi }}

      - name: Build or verify Mochizuki
        shell: pwsh
        run: |
          cmd /d /c tools\build\build-mochizuki-runtime.cmd --reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build host and run release checks concurrently
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 25 }}
        shell: pwsh
        env:
          # The resolved (tag-authoritative) version stamps the DLL's product version
          # (NR_PRODUCT_VERSION); the repo VERSION file alone could lag the tag and
          # split the package name from the in-game banner. PACKAGE_RELEASE.ps1
          # already writes this same version into the in-package metadata.
          NR_PRODUCT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            ./tools/build/build-ci.ps1 -FullRegression
          } else {
            ./tools/build/build-ci.ps1
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create ephemeral package signing certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/release/package-signing.ps1
          $cert = Get-PackageSigningCertificate -Ephemeral
          "PACKAGE_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore public person assets
        uses: actions/cache@v5
        with:
          path: |
            assets/person-model/onnxruntime.dll
            assets/person-model/pphumanseg.onnx
            assets/person-model/yolo11n-seg.onnx
            assets/person-model/yunet.onnx
          key: person-assets-${{ runner.os }}-py312-${{ hashFiles('tools/release/prepare-person-assets.ps1') }}

      - name: Prepare person assets (CRT refreshed each run)
        shell: pwsh
        run: |
          ./tools/release/prepare-person-assets.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Best-effort refresh of the bundled OptiPatcher.asi: fetch the latest rolling release,
      # validate the PE image, and only then replace the committed copy that feeds packaging.
      # On any failure the committed offline copy is kept. Local packaging never runs this step;
      # the committed asset changes only through CI or a manual update.
      - name: Refresh bundled OptiPatcher (best effort)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/optiscaler/OptiPatcher/releases/download/rolling/OptiPatcher.asi'
          $dst = 'assets/plugins/OptiPatcher.asi'
          $tmp = Join-Path $env:RUNNER_TEMP 'OptiPatcher.asi'
          $ok = $false
          try {
            & curl.exe -f -s -S -L --connect-timeout 10 --max-time 60 -o $tmp $url
            if ($LASTEXITCODE -ne 0) { throw "download exit $LASTEXITCODE" }
            # PE validation: MZ header, PE signature, AMD64 machine, plausible plugin size.
            $bytes = [IO.File]::ReadAllBytes($tmp)
            if ($bytes.Length -lt 4096 -or $bytes.Length -gt 20MB) { throw "implausible size $($bytes.Length)" }
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'missing MZ header' }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -le 0 -or ($peOffset + 6) -gt $bytes.Length) { throw "bad e_lfanew $peOffset" }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) { throw 'missing PE signature' }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) { throw ('not AMD64 (machine 0x{0:X4})' -f $machine) }
            $ok = $true
          } catch {
            Write-Warning "OptiPatcher refresh skipped, keeping committed copy: $_"
          }
          if ($ok) {
            New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
            Copy-Item -LiteralPath $tmp -Destination $dst -Force
            $committed = git hash-object $dst
            Write-Host "Bundled OptiPatcher.asi refreshed for packaging (blob $committed)."
          }
          # Best-effort step: a handled download/validation failure keeps the committed copy and
          # must stay green, or the Actions pwsh wrapper would exit with curl's nonzero code and
          # skip packaging. Clear the handled exit code explicitly.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Package user zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          powershell -ExecutionPolicy Bypass -File tools\release\PACKAGE_RELEASE.ps1 `
            -Version $ver `
            -OptiDll "$env:BUILD_OUT\OptiScaler.dll" `
            -SigningThumbprint "$env:PACKAGE_SIGNING_THUMBPRINT" `
            -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist\OptScaler-NR-$ver.zip")) {
            throw "Package zip missing for $ver"
          }

      - name: Remove ephemeral signing key
        if: ${{ always() && env.PACKAGE_SIGNING_THUMBPRINT != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PACKAGE_SIGNING_THUMBPRINT -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid ephemeral certificate identity' }
          Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Security/Microsoft.PowerShell.Security.psd1')
          Get-Item -LiteralPath "Cert:/CurrentUser/My/$env:PACKAGE_SIGNING_THUMBPRINT" -ErrorAction Stop | Out-Null
          Remove-Item -LiteralPath "Cert:/CurrentUser/My/$env:PACKAGE_SIGNING_THUMBPRINT" -DeleteKey -ErrorAction Stop

      - name: Guard against proprietary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Independent CI tripwire: inspect the exact archive that Release uploads.
          $ver = '${{ steps.ver.outputs.version }}'
          $zipPath = "dist\OptScaler-NR-$ver.zip"
          $forbidden = '(?i)^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|dlssnr(?:-int4|-small)?\.bin|pipeline\.cache|version\.dll|dlssnr_on_amd_setup\.exe)$'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zipPath))
          try {
            $bad = @($archive.Entries |
              Where-Object { -not [string]::IsNullOrEmpty($_.Name) -and $_.Name -match $forbidden } |
              ForEach-Object { $_.FullName })
            $entryNames = @($archive.Entries | ForEach-Object { $_.Name })
            $entryPaths = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
          } finally {
            $archive.Dispose()
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "FORBIDDEN: $_" }
            throw 'Refusing to publish: proprietary/user-supplied binaries found in package zip.'
          }
          $required = @('OptiScaler.dll', 'LmxxfNrRuntime.dll', 'MochizukiNrRuntime.dll', 'OptiScaler.ini', 'Setup.ps1', 'Setup.bat', 'LICENSE', 'NOTICE', 'person-worker.exe', 'onnxruntime.dll', 'pphumanseg.onnx', 'yolo11n-seg.onnx', 'yunet.onnx')
          foreach ($r in $required) {
            if ($entryNames -notcontains $r) {
              throw "REQUIRED COMPONENT MISSING IN ZIP: $r"
            }
          }

          $dependencyPaths = @(
            'OptiScaler/amd_fidelityfx_loader_dx12.dll',
            'OptiScaler/amd_fidelityfx_upscaler_dx12.dll',
            'OptiScaler/amd_fidelityfx_framegeneration_dx12.dll',
            'OptiScaler/amd_fidelityfx_denoiser_dx12.dll',
            'OptiScaler/amd_fidelityfx_vk.dll',
            'OptiScaler/libxess.dll', 'OptiScaler/libxess_fg.dll', 'OptiScaler/libxell.dll',
            'OptiScaler/D3D12_OptiScaler/D3D12Core.dll',
            'person-model/person-worker.exe', 'person-model/onnxruntime.dll',
            'person-model/pphumanseg.onnx', 'person-model/yolo11n-seg.onnx', 'person-model/yunet.onnx',
            'person-model/msvcp140.dll', 'person-model/vcruntime140.dll', 'person-model/vcruntime140_1.dll'
          )
          foreach ($path in $dependencyPaths) {
            if ($entryPaths -notcontains $path) { throw "REQUIRED DEPENDENCY MISSING IN ZIP: $path" }
          }

          foreach ($path in @('model-tools/dlssnr-int4-weights.exe', 'model-tools/dlssnr-int4.sha256', 'mochizuki-int4.ps1') +
              @(Get-Content tools/install/mochizuki-owned.txt | Where-Object { $_ -and !($_.StartsWith('#')) } | ForEach-Object { "dlssnr-amd/$_" })) {
            if ($entryPaths -notcontains $path) { throw "REQUIRED MOCHIZUKI COMPONENT MISSING: $path" }
          }
          if ($entryPaths -match '(?i)/(aco-cache|pipeline-binaries)/') { throw 'Driver cache included in package.' }
          foreach ($license in @('OptiScaler_LICENSE.txt', 'Lmxxf_MIT.txt', 'Mochizuki_MIT.txt', 'RenoDX_MIT.txt', 'ONNXRuntime_MIT.txt', 'YOLO11_AGPL-3.0.txt', 'PPHumanSeg_Apache-2.0.txt', 'YuNet_MIT.txt', 'XeSS_LICENSE.txt', 'FidelityFX_v1_LICENSE.md', 'FidelityFX_v2_LICENSE.md', 'DirectX_LICENSE.txt')) {
            if ($entryPaths -notcontains "Licenses/$license") {
              throw "REQUIRED LICENSE MISSING IN ZIP: $license"
            }
          }

      - name: Replay Mochizuki upstream pin for test package
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content tools/mochizuki-sync/manifest.json -Raw | ConvertFrom-Json).commit
          $upstream = Join-Path $env:RUNNER_TEMP 'mochizuki-source-check'
          git init $upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $upstream fetch --depth=1 https://github.com/mochizuki0323/DLSSNR-AMD.git $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/mochizuki-sync/check.py --upstream $upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload tested package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: OptScaler-NR-test-${{ github.run_id }}
          path: dist/OptScaler-NR-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-logs
          path: |
            exports/release-ci/*.log
            exports/release-ci/tests/summary.txt
          if-no-files-found: ignore

      - name: Create GitHub Release metadata
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # Pre-release when tag name has an -alpha/-beta/-rc suffix (e.g. v1.9.1-alpha).
          # Formal tags like v1.9.1 stay latest/stable; plain substrings such as "source" do not count.
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body_path: exports/release-notes.md

      - name: Upload release asset with verified retries
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 20
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -B .github/scripts/publish_release_asset.py --tag "$env:RELEASE_TAG" --asset "dist/OptScaler-NR-$env:RELEASE_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  regression:
    if: github.event_name == 'workflow_dispatch' && !inputs.test_package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up pinned compiler
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
          toolset: ${{ env.MSVC_VERSION }}
          sdk: ${{ env.WINDOWS_SDK_VERSION }}
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build and run full regression
        shell: pwsh
        run: |
          cmd /d /c tools\build\build-mochizuki-runtime.cmd --reuse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/build/build-ci.ps1 -FullRegression
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay Mochizuki upstream pin
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content tools/mochizuki-sync/manifest.json -Raw | ConvertFrom-Json).commit
          $upstream = Join-Path $env:RUNNER_TEMP 'mochizuki-source-check'
          git init $upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $upstream fetch --depth=1 https://github.com/mochizuki0323/DLSSNR-AMD.git $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tools/mochizuki-sync/check.py --upstream $upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-logs
          path: |
            exports/release-ci/*.log
            exports/release-ci/tests/summary.txt
          if-no-files-found: ignore
