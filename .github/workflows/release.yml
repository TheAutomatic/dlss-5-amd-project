# Build OptiScaler(NR) v2.0+ (Official OptiScaler + dlssnr-amd.asi + openrr-amd.asi + GUI Launcher)
# and attach the user zip to a GitHub Release.
#
# - Official OptiScaler, DLSSNR-AMD (+ CJK lang pack), OpenRR-ASI, and OptiPatcher.asi are fetched and
#   SHA-256-verified from upstream GitHub Releases using tools/build/upstream-pins.json during packaging.
# - Wiki proxy-profiles.json is refreshed best-effort in CI, falling back to the committed copy in assets/.
# - Does NOT package NVIDIA DLLs or extracted model weights.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      test_package:
        description: Build and upload a test ZIP (no Release)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Enable long Git paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
              $v = (Get-Content -LiteralPath VERSION -Raw).Trim()
          }
          if ($v -notmatch '^[0-9A-Za-z._-]+$') { throw "Invalid version: $v" }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $v += "-test-$env:GITHUB_RUN_NUMBER-$($env:GITHUB_SHA.Substring(0,8))" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Reject moved published tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -B .github/scripts/publish_release_asset.py --tag "$env:RELEASE_TAG" --verify-source "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refresh Wiki compatibility profiles (best effort, fallback to committed assets/)
        shell: pwsh
        run: |
          try {
            & ./tools/compat/update-wiki-profiles.ps1
          } catch {
            Write-Warning "Wiki profile refresh skipped, keeping committed assets/compatibility/proxy-profiles.json: $_"
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Cache upstream release archives
        uses: actions/cache@v6
        with:
          path: cache/downloads
          key: upstream-downloads-${{ runner.os }}-${{ hashFiles('tools/build/upstream-pins.json') }}
          restore-keys: |
            upstream-downloads-${{ runner.os }}-

      - name: Create ephemeral package signing certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/release/package-signing.ps1
          $cert = Get-PackageSigningCertificate -Ephemeral
          "PACKAGE_SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package user zip (fetches verified OptiScaler/DLSSNR-AMD/OpenRR/OptiPatcher, compiles Launcher, signs & verifies)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File tools\release\PACKAGE_RELEASE.ps1 `
            -Version $ver `
            -RefreshOptiPatcher `
            -SigningThumbprint "$env:PACKAGE_SIGNING_THUMBPRINT" `
            -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "dist\OptiScaler-NR-Win-$ver.zip")) {
            throw "Package zip missing for $ver"
          }

      - name: Remove ephemeral signing key
        if: ${{ always() && env.PACKAGE_SIGNING_THUMBPRINT != '' }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PACKAGE_SIGNING_THUMBPRINT -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid ephemeral certificate identity' }
          Import-Module (Join-Path $PSHOME 'Modules/Microsoft.PowerShell.Security/Microsoft.PowerShell.Security.psd1')
          Get-Item -LiteralPath "Cert:/CurrentUser/My/$env:PACKAGE_SIGNING_THUMBPRINT" -ErrorAction Stop | Out-Null
          Remove-Item -LiteralPath "Cert:/CurrentUser/My/$env:PACKAGE_SIGNING_THUMBPRINT" -DeleteKey -ErrorAction Stop

      - name: Guard against proprietary files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.ver.outputs.version }}'
          $zipPath = "dist\OptiScaler-NR-Win-$ver.zip"
          $forbidden = '(?i)^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|dlssnr(?:-int4|-small)?\.bin|CC_(?:SMALL_FP8|SMALL_FP8_EXPERIMENTAL|SILVER_AARDWOLD|SILVER_AARDWOLD_OPTIMIZED|SILVER_AARDWOLD_OPTIMIZED_INT4)\.bin|pipeline\.cache|version\.dll|dlssnr_on_amd_setup\.exe)$'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zipPath))
          try {
            $bad = @($archive.Entries |
              Where-Object { -not [string]::IsNullOrEmpty($_.Name) -and $_.Name -match $forbidden } |
              ForEach-Object { $_.FullName })
            $entryPaths = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
          } finally {
            $archive.Dispose()
          }
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "FORBIDDEN: $_" }
            throw 'Refusing to publish: proprietary/user-supplied binaries found in package zip.'
          }
          foreach ($req in @('OptiScaler.dll', 'OptiScaler.ini', 'OptiScalerNRLauncher.exe', 'Setup.ps1', 'install.sh', 'OptiScaler/plugins/dlssnr-amd.asi', 'OptiScaler/plugins/openrr-amd.asi', 'OptiScaler/plugins/openrr-ngx-host.dll', 'OptiScaler/plugins/OptiPatcher.asi', 'rtx-remix-mc/remixbridge.dll', 'Licenses/RTX-Remix-Minecraft-AMD-Patch_LICENSE.txt', 'Licenses/RTX-Remix-Minecraft-AMD-Patch_NOTICE.txt', 'Licenses/NVIDIA-rtx-remix-minecraft-Apache-2.0.txt', 'dlssnr-amd/aco/d3d12_outer.nra', 'dlssnr-amd/aco/rdna3/d3d12_outer.nra', 'dlssnr-amd/lang/zh-CN.txt', 'dlssnr-amd/lang/fonts/NotoSansCJKsc-Regular.ttf', 'model-tools/dlssnr_extract_model.exe', 'experimental/dlssnr-small-experimental.delta', 'optimized/dlssnr-optimized.delta', 'dlssnr-amd-optiscaler.ini', 'dlssnr-amd-optiscaler-renodx.ini', 'dlssnr-amd-standalone.ini', 'dlssnr-amd-addon.ini', 'standalone/dxgi.dll', 'standalone/vk-override/implicit_layer/dlssnr_standalone.json', 'reshade/ReShade64.dll', 'reshade/dlssnr_amd.addon64', 'reshade/ReShade.ini', 'reshade/ReShadePreset.ini', 'reshade/ReShadePreset-d3d9.ini', 'reshade/vk-override/implicit_layer/ReShade64.json', 'reshade/reshade-shaders/Shaders/DLSS5_Feed.fx', 'dxvk/d3d9.dll', 'dxvk/dxgi.dll', 'vulkan/vulkan-1.dll', 'openrr-amd.ini', 'openrr-amd/aco/gfx1201/openrr-d3d12-v1/manifest.msgpack', 'openrr-amd/aco/gfx1200/openrr-d3d12-v1/manifest.msgpack', 'openrr-amd/lang/zh-CN.txt', 'openrr-amd/lang/fonts/NotoSansCJKsc-Regular.ttf', 'LICENSE', 'NOTICE')) {
            if ($entryPaths -notcontains $req) { throw "REQUIRED COMPONENT MISSING IN ZIP: $req" }
          }

      - name: Upload tested package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: OptiScaler-NR-test-${{ github.run_id }}
          path: dist/OptiScaler-NR-Win-${{ steps.ver.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $tag = $env:GITHUB_REF_NAME
          $ref = "refs/tags/$tag"
          git fetch --force --no-tags origin "+${ref}:${ref}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $objType = (& git cat-file -t $ref 2>$null | Out-String).Trim()
          $notes = ''
          if ($objType -eq 'tag') {
            $raw = (& git for-each-ref $ref --format='%(contents)' | Out-String)
            $raw = [regex]::Replace($raw, '(?s)\r?\n-----BEGIN (?:PGP|SSH) SIGNATURE-----.*$', '').Trim()
            if (-not [string]::IsNullOrWhiteSpace($raw) -and $raw -cne $tag) {
              $notes = $raw
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $isShallow = (& git rev-parse --is-shallow-repository 2>$null | Out-String).Trim()
            if ($isShallow -eq 'true') {
              git fetch --tags --unshallow origin
            } else {
              git fetch --tags origin
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & git rev-parse --verify --quiet "$env:GITHUB_SHA^" >$null 2>$null
            $prevTag = if ($LASTEXITCODE -eq 0) { (& git describe --tags --abbrev=0 "$env:GITHUB_SHA^" 2>$null | Out-String).Trim() } else { '' }
            $range = if ($LASTEXITCODE -eq 0 -and $prevTag) { "$prevTag..$env:GITHUB_SHA" } else { "$env:GITHUB_SHA -n 20" }
            $logArgs = @('log', '--no-merges', '--pretty=format:- %s (%h)') + ($range -split ' ')
            $lines = (& git @logArgs | Out-String).Trim()
            $parts = @('## Changes', '')
            $parts += if ($lines) { $lines } else { "- Release $tag" }
            if ($prevTag) {
              $parts += @('', "**Full Changelog**: https://github.com/$env:GITHUB_REPOSITORY/compare/$prevTag...$tag")
            }
            $notes = $parts -join "`n"
          }
          New-Item -ItemType Directory -Force exports | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'exports/release-notes.md'), ($notes + "`n"), [Text.UTF8Encoding]::new($false))
          $global:LASTEXITCODE = 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: exports/release-notes.md
          generate_release_notes: false

      - name: Upload release asset with verified retries
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 20
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -B .github/scripts/publish_release_asset.py --tag "$env:RELEASE_TAG" --asset "dist/OptiScaler-NR-Win-$env:RELEASE_VERSION.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Linux packages: Mochizuki's upstream DLSSNR-AMD Linux release (x86_64 + i686, SHA-256 pinned under
  # "mochizukiLinux" in tools/build/upstream-pins.json) + CJK lang pack + the stdlib-only Python launcher.
  # Runs after `build` so the GitHub Release already exists when assets are attached on tag pushes.
  linux:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(tr -d '[:space:]' < VERSION)"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z._-]+$'; then echo "Invalid version: $v" >&2; exit 1; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="$v-test-$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:8}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache upstream Linux archives
        uses: actions/cache@v6
        with:
          path: cache/linux
          key: upstream-linux-${{ hashFiles('tools/build/upstream-pins.json') }}
          restore-keys: |
            upstream-linux-

      - name: Launcher unit tests
        shell: bash
        working-directory: tools/linux
        run: python3 -B launcher/selftest.py --unit-only -v

      - name: Package Linux tarballs (x86_64 + i686)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/release/package-linux.sh --version '${{ steps.ver.outputs.version }}' --arch all --out dist --cache cache/linux
          ls -la dist

      - name: Guard against proprietary files and self-test packages
        shell: bash
        run: |
          set -euo pipefail
          ver='${{ steps.ver.outputs.version }}'
          work="$RUNNER_TEMP/linux-pkg"
          mkdir -p "$work"
          for arch in x86_64 i686; do
            name="OptiScaler-NR-Linux-$arch-$ver"
            tgz="dist/$name.tar.gz"
            test -f "$tgz" && test -f "$tgz.sha256"
            (cd dist && sha256sum -c "$name.tar.gz.sha256")
            # Same forbidden-name regex as the Windows guard; also require a single top-level folder.
            python3 -B - "$tgz" "$name" <<'PY'
          import re, sys, tarfile
          tgz, top = sys.argv[1], sys.argv[2]
          forbidden = re.compile(r'^(nvngx.*\.dll|dlssnr_amd_pass.*\.dll|dlssnr_on_amd_weights\.bin|dlssnr(?:-int4|-small)?\.bin|CC_(?:SMALL_FP8|SMALL_FP8_EXPERIMENTAL|SILVER_AARDWOLD|SILVER_AARDWOLD_OPTIMIZED|SILVER_AARDWOLD_OPTIMIZED_INT4)\.bin|pipeline\.cache|version\.dll|dlssnr_on_amd_setup\.exe)$', re.I)
          with tarfile.open(tgz) as tf:
              names = tf.getnames()
          bad = [n for n in names if forbidden.match(n.rstrip('/').rsplit('/', 1)[-1])]
          stray = [n for n in names if n != top and not n.startswith(top + '/')]
          for n in bad:
              print('FORBIDDEN: ' + n)
          for n in stray:
              print('UNEXPECTED TOP-LEVEL ENTRY: ' + n)
          if bad or stray:
              sys.exit('Refusing to publish ' + tgz)
          PY
            tar -xzf "$tgz" -C "$work"
            NR_E2E_TMP="$RUNNER_TEMP" python3 -B "$work/$name/launcher/selftest.py" -v
            rm -rf "${work:?}/$name"
          done

      - name: Upload tested Linux packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: OptiScaler-NR-Linux-test-${{ github.run_id }}
          path: |
            dist/OptiScaler-NR-Linux-*-${{ steps.ver.outputs.version }}.tar.gz
            dist/OptiScaler-NR-Linux-*-${{ steps.ver.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux release assets with verified retries
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 20
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for arch in x86_64 i686; do
            python -B .github/scripts/publish_release_asset.py --tag "$RELEASE_TAG" --asset "dist/OptiScaler-NR-Linux-$arch-$RELEASE_VERSION.tar.gz"
          done
